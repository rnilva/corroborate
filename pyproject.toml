[project]
name = "corroborate"
version = "0.0.1"
description = "Framework for executable scientific claims — intervention study, falsification, causal discovery"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "optax>=0.2.0",
    "gymnax>=0.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corroborate"]

[dependency-groups]
dev = [
    "pytest>=8",
    "basedpyright>=1.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.pyright]
include = ["src", "tests"]
stubPath = "stubs"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportImplicitOverride = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "none"
# Custom strictness for our typing-discipline rule (CLAUDE.md):
reportAny = "error"
reportExplicitAny = "error"

# Local stubs at `stubs/` narrow gymnax + optax to the surface the
# RL subtree actually consumes (see stubs/*/__init__.pyi). With those
# in place the rl/ subtree only needs JAX-stub looseness — JAX itself
# still leaks Unknown through `jnp.zeros`, `jax.tree.map` lambdas, etc.
# Relax the Unknown-family rules + reportAny here so claims authoring
# isn't a per-line ignore festival; discipline is preserved everywhere
# else in the codebase.
[[tool.pyright.executionEnvironments]]
root = "src/corroborate/rl"
reportAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

[[tool.pyright.executionEnvironments]]
root = "tests/rl"
reportAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

# Framework tests that exercise reductions / measurables on jax
# arrays touch jax.numpy directly (jnp.arange, jnp.asarray); the
# JAX stubs leak Unknown through these, same way the rl/ subtree
# does. Relax the Unknown-family rules + reportAny here on the
# same boundary; non-jax framework tests stay strict because they
# never trip these rules.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
