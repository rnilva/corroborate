[project]
name = "corroborate"
version = "0.0.1"
description = "Framework for executable scientific claims — intervention study, falsification, causal discovery"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corroborate"]

[dependency-groups]
dev = [
    "pytest>=8",
    "basedpyright>=1.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportImplicitOverride = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "none"
# Custom strictness for our typing-discipline rule (CLAUDE.md):
reportAny = "error"
reportExplicitAny = "error"
