[project]
name = "corroborate"
version = "0.0.1"
description = "Framework for executable scientific claims — intervention study, falsification, causal discovery"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "optax>=0.2.0",
    "gymnax>=0.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corroborate"]

[dependency-groups]
dev = [
    "pytest>=8",
    "basedpyright>=1.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.pyright]
include = ["src", "tests"]
stubPath = "stubs"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportImplicitOverride = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "none"
# Custom strictness for our typing-discipline rule (CLAUDE.md):
reportAny = "error"
reportExplicitAny = "error"

# Pyright matches `executionEnvironments` in declaration order
# (first-match), not by longest-prefix. List the most specific
# roots FIRST so the broader `src/corroborate` block doesn't
# shadow them.
#
# RL subtree: full relaxation. JAX leaks Any through jnp.* return
# types (under real stubs); the rl/ subtree is the boundary where
# stub looseness is unavoidable.
[[tool.pyright.executionEnvironments]]
root = "src/corroborate/rl"
reportAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

# Framework root: Unknown-family relaxed. `reductions.py` is the
# framework's JAX boundary at the post-hoc analytical layer
# (jnp.unique, jnp.mean, etc.). Non-JAX framework files (claim.py,
# bridge.py, schema.py, ...) never emit Unknown values, so they
# continue to enforce the strict Unknown-free contract. `reportAny`
# / `reportExplicitAny` stay strict at this scope — Any is
# forbidden by the typing discipline at the framework level.
[[tool.pyright.executionEnvironments]]
root = "src/corroborate"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

[[tool.pyright.executionEnvironments]]
root = "tests/rl"
reportAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

# Framework tests that exercise reductions / measurables on jax
# arrays touch jax.numpy directly (jnp.arange, jnp.asarray); the
# JAX stubs leak Unknown through these, same way the rl/ subtree
# does. Relax the Unknown-family rules + reportAny here on the
# same boundary; non-jax framework tests stay strict because they
# never trip these rules.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
