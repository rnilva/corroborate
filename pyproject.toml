[project]
name = "corroborate"
version = "0.0.1"
description = "Framework for executable scientific claims — intervention study, falsification, causal discovery"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corroborate"]

[dependency-groups]
dev = [
    "pytest>=8",
]
