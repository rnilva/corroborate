[project]
name = "corroborate"
version = "0.0.1"
description = "Framework for executable scientific claims — intervention study, falsification, causal discovery"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.10",          # distribution quantiles + cdf for stats module
    "statsmodels>=0.14",    # noncentral-t-aware MDE / power machinery
    "pyarrow>=24.0.0",      # incremental Parquet writer for streaming merges
    "fsspec>=2024.0",       # provider-agnostic cloud archive (S3/GCS/R2/Azure via extras)
    "s3fs>=2026.3.0",
    "jumanji>=1.1.1",
    "requests>=2.33.1",
    "networkx>=3.6.1",
    "dowhy>=0.14",
]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0",          # `load_hypothesis` + `_internals/yaml`
]
dowhy = [
    "dowhy>=0.13",
    "pandas>=2.0",
    "networkx>=3.0",
]

[tool.uv.workspace]
# `corroborate_rl` is the RL substrate (DQN + gymnax envs +
# sweep dispatcher). It depends on the framework but the
# framework does not depend on it — substrate-neutrality
# enforced by package boundary, not just by author discipline.
members = ["src/corroborate_rl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corroborate"]

[dependency-groups]
dev = [
    "pytest>=8",
    "basedpyright>=1.18",
    "mutmut>=3.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not slow'"
markers = [
    "slow: end-to-end DQN/JAX workloads (jit compile + scan loops). Skipped by default for fast iteration. Run via `uv run pytest -m slow tests/` to run only slow tests, or `uv run pytest -m '' tests/` (empty marker) to run the full suite.",
]

[tool.pyright]
include = ["src", "tests"]
# `src/corroborate_rl/` is the sibling RL substrate package with
# its own `pyproject.toml` + `[tool.basedpyright]` block. Framework
# pyright runs do NOT type-check substrate code; the substrate
# enforces its own discipline. Without this exclude, `include =
# ["src", ...]` globs substrate files because `corroborate_rl`
# lives under `src/`.
#
# `experiments/` excluded from the strict-Any contract — those
# scripts are ad-hoc analysis runners that consume the framework
# at the polars / numpy / pandas iter_rows boundary; the
# framework's type discipline is for the framework itself, not
# for one-off corpus consumers. Many of those scripts will be
# deleted rather than typed.
exclude = ["src/corroborate_rl"]
extraPaths = ["."]
stubPath = "stubs"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportImplicitOverride = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "none"
# Custom strictness for our typing-discipline rule (CLAUDE.md):
reportAny = "error"
reportExplicitAny = "error"

# Pyright matches `executionEnvironments` in declaration order
# (first-match), not by longest-prefix. List the most specific
# roots FIRST so the broader `src/corroborate` block doesn't
# shadow them.
#
# Sibling RL package has its own `pyproject.toml` with its own
# `[tool.basedpyright]` config; framework-side `pyright` runs
# never touch `src/corroborate_rl/`. (If pyright is ever invoked
# across both packages from the repo root, that should go through
# the substrate's pyproject explicitly.)

# Analyses subtree: this is the post-hoc numerical-array boundary.
# numpy / scipy / pandas stubs leak Any through .mean()/.shape/
# etc.; the analyses package is the layer where that's expected.
# Relax fully here.
[[tool.pyright.executionEnvironments]]
root = "src/corroborate/analyses"
reportAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

# Framework root: Unknown-family relaxed. `reductions.py` is the
# framework's JAX boundary at the post-hoc analytical layer
# (jnp.unique, jnp.mean, etc.). Non-JAX framework files (claim.py,
# bridge.py, schema.py, ...) never emit Unknown values, so they
# continue to enforce the strict Unknown-free contract. `reportAny`
# / `reportExplicitAny` stay strict at this scope — Any is
# forbidden by the typing discipline at the framework level.
[[tool.pyright.executionEnvironments]]
root = "src/corroborate"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

# Framework tests boundary. Numpy / scipy / pandas / polars stubs
# leak Unknown through `.shape`, `.mean()`, `.iter_rows`, etc.;
# tests sit at the array-stub boundary the same way `analyses/`
# does. Relax the Unknown-family rules here.
#
# `reportUnusedFunction = "none"` is the test-specific relaxation:
# tests routinely define `@measurable` / `@claim`-decorated nested
# fixtures whose only purpose is the side-effect registration in
# the global registry. The local symbol is unused by design — the
# test bodies retrieve the fixture via `get_registered(name)`.
# Strict-unused-function detection in tests/ would force a
# scattered `# pyright: ignore[reportUnusedFunction]` per fixture,
# losing the architectural signal. The rule stays strict in `src/`
# where genuine unused functions are real bugs.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportUnusedFunction = "none"


# ============ Mutation testing (mutmut) ============
#
# Mutates the analysis primitives covered by the analytic suite
# (tests/analytic/lg_scm/). Surviving mutants are gaps in the
# closed-form bounds — either the bound is too loose or a code
# path lacks coverage. Equivalent mutants need human triage.
#
# Default scope is narrow: framework primitives our analytic
# suite directly targets. Override at the CLI for a broader
# scan (`uv run mutmut run --paths-to-mutate src/corroborate/`).
#
# Test scope mirrors: only the analytic-suite tests run per
# mutant. The full unit-test suite would catch many mutants by
# accident (synthetic-input tests pass on small numerical
# perturbations); restricting to analytic-only tests focuses
# the signal on whether the closed-form bounds bite.
#
# Run: `uv run mutmut run`
# Triage results: `uv run mutmut results` or `uv run mutmut browse`.
[tool.mutmut]
# `paths_to_mutate`: framework primitives the analytic suite
# directly targets. Surviving mutants are gaps in the closed-form
# bounds — either the bound is too loose or a code path lacks
# coverage.
paths_to_mutate = [
    "src/corroborate/analyses/paired_g.py",
    "src/corroborate/analyses/paired_g_per_burst.py",
    "src/corroborate/analyses/paired_link_per_burst.py",
    "src/corroborate/analyses/factorial_2x2.py",
    "src/corroborate/analyses/meta_regression_paired_g.py",
    "src/corroborate/analyses/meta_regression_per_burst.py",
    "src/corroborate/analyses/mundlak_paired_g_per_burst.py",
    "src/corroborate/analyses/mundlak_decomposition.py",
    "src/corroborate/analyses/tautology_audit.py",
    "src/corroborate/analyses/dowhy.py",
    "src/corroborate/analyses/verdict_distribution.py",
    "src/corroborate/stats/effect_size.py",
    "src/corroborate/measurables/redundancy_check.py",
    "src/corroborate/graph/discovery.py",
]
# `also_copy`: mutmut copies `paths_to_mutate` + `also_copy` into
# `mutants/`. Framework imports from `corroborate.bridge`,
# `corroborate.core`, `corroborate.measurables`, etc. — copy the
# whole `src/` tree so those resolve. Non-mutated files stay at
# their original content; mutants only generate for `paths_to_mutate`.
also_copy = [
    "src/",
    # Build needs `README.md` (pyproject `readme = "README.md"`)
    # — without it the per-mutant build fails before pytest even
    # collects, and every mutant is silently marked "survived".
    "README.md",
]
# `tests_dir`: both the framework-side analytic suite AND the RL
# substrate's analytic suite (tabular MDP / deadly-triad). The
# RL-side `tabular/test_framework_detects_hasselt_correction.py`
# exercises `paired_g` + `verdict_from_paired_stats` from a
# different angle (closed-form Hasselt cells) than `lg_scm/`, so
# it tightens the bound on those primitives independently.
tests_dir = [
    "tests/analytic/",
    "src/corroborate_rl/tests/analytic/",
    # Pure-math primitives that don't need a substrate to test
    # (effect-size formulas, Spearman partials, jaccard / R²
    # tautology checks). Each test in these files asserts a
    # specific formula's output against a closed-form expected
    # value — the "substrate" is the math itself. Without these
    # the mutmut "no tests" bucket is ~330 mutants on functions
    # that already have closed-form coverage but whose tests
    # happened to live outside `tests/analytic/`.
    "tests/test_statistics.py",
    "tests/test_causal_discovery.py",
    "tests/test_redundancy_check.py",
]
# `pytest_add_cli_args`: `--import-mode=importlib` is required
# because both `tests/` (framework) and
# `src/corroborate_rl/tests/` (RL substrate) declare a top-level
# `tests` package via `__init__.py`. Pytest's default `prepend`
# import mode would refuse to load both — `importlib` mode
# resolves modules by file path, sidestepping the package-name
# collision.
pytest_add_cli_args = ["--import-mode=importlib"]
