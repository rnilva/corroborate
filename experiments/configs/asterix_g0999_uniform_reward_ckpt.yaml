name: asterix_g0999_uniform_reward_ckpt
out_dir: experiments/data/asterix_g0999_uniform_reward_ckpt
env_binding: shared
archive_remote: s3://corroborate-archive/asterix_g0999_uniform_reward_ckpt

# Asterix γ=0.999 with UniformReward(value=0.03) wrapper.
#
# Counterfactual probe for the within-episode reward-timing
# component of the proposed Asterix γ=0.999 deadly-triad. Canonical
# Asterix has rewards cluster late (V's mean r_t/ep_len ≈ 0.57);
# this wrapper replaces the env's per-step reward with a constant
# 0.03 (≈ canonical V's average per-step reward: total ~22 / mean
# ep_len ~750 ≈ 0.029, rounded).
#
# Predictions under the deadly-triad hypothesis:
#   - V eval drops substantially (no goal-pursuit signal; eval
#     collapses to "survive longest")
#   - D eval drops similarly
#   - Cohen's d(D vs V) collapses from canonical −1.45 toward zero
#     (|d| < 0.3 ≈ "no harm")
#
# If d stays ≤ −1: reward-timing structure isn't the load-bearing
# condition; harm comes from something else (sharpness, γ-amplifying
# Q-magnitude, FA-specific dynamics). The remaining triad conditions
# (γ-horizon coverage, action sharpness) would need separate probes.
#
# Same canonical HPs as asterix_g0999_canonical_n_eps20_ckpt: 1M
# steps, n_episodes=20, sync=1000, lr=1e-4 + warmup, ε anneal 100k.
# Q checkpoints kept for downstream per-burst analyses.
#
# Cells: 1 intervention × 2 arms × 15 seeds = 30 cells.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true

envs:
  - {name: Asterix-MinAtar, n_seeds: 15, chunk_size: 15,
     wrappers: [{type: uniform_reward, value: 0.03}]}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.999
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: uniform_reward_v0.03
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
