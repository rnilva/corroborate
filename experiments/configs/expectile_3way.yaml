name: expectile_3way
out_dir: experiments/data/expectile_3way
env_binding: shared

envs:
  - {name: Catch-bsuite,             n_seeds: 30, chunk_size: 15}
  - {name: DiscountingChain-bsuite,  n_seeds: 30, chunk_size: 15}
  - {name: MountainCar-v0,           n_seeds: 30, chunk_size: 15}
  - {name: Acrobot-v1,               n_seeds: 30, chunk_size: 15}
  - {name: FourRooms-misc,           n_seeds: 30, chunk_size: 15}

defaults:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: vanilla_dqn

  - name: ddqn
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: expectile_dqn
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: expectile_greedify, tau: 0.7}
