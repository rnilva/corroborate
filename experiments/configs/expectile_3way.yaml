name: expectile_3way
out_dir: experiments/data/expectile_3way
arms_shape: chunked

envs:
  - {name: Catch-bsuite,             n_seeds: 30, chunk_size: 15}
  - {name: DiscountingChain-bsuite,  n_seeds: 30, chunk_size: 15}
  - {name: MountainCar-v0,           n_seeds: 30, chunk_size: 15}
  - {name: Acrobot-v1,               n_seeds: 30, chunk_size: 15}
  - {name: FourRooms-misc,           n_seeds: 30, chunk_size: 15}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: vanilla_dqn
    predicted_direction: null

  - name: ddqn
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}

  - name: expectile_dqn
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: expectile_greedify, tau: 0.7}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: expectile_greedify, tau: 0.7}
