name: pacman_postfix_seeds10to29
out_dir: experiments/data/pacman_postfix_seeds10to29
arms_shape: paired

# 20 additional seeds (10..29) for post-fix Pacman to power the
# paired-Δo test. Companion to pacman_10seed_postfix (seeds 0-9).
envs:
  - {name: PacMan-jumanji, n_seeds: 20, chunk_size: 2, seed_offset: 10}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  3
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [8, 16]
    kernel_size: 3
    hidden: [64]

hypotheses:
  - name: ddqn_vs_vanilla
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
