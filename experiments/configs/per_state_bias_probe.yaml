name: per_state_bias_probe
out_dir: experiments/data/per_state_bias_probe
env_binding: shared

# Test the per-state cumulative bias measurable on the two envs where
# the textbook DDQN story should fire most cleanly.
# 2 envs × 2 arms × 30 seeds = 120 cells.
envs:
  # FourRooms γ=0.99: textbook GOAL-polarity chain MDP.
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}
  # Acrobot γ=0.999: per CLAIM 10, link causally HELD via DoWhy.
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  20
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  # FR γ=0.99 — the textbook regime (CLAIM 5: g_link=+1.11)
  - name: vanilla_dqn_fr_g099
    base:
      gamma: 0.99
    scope: env_name == 'FourRooms-misc'
  - name: ddqn_fr_g099
    base:
      gamma: 0.99
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
    scope: env_name == 'FourRooms-misc'

  # Acrobot γ=0.999 — CLAIM 10 regime
  - name: vanilla_dqn_acrobot_g0999
    base:
      gamma: 0.999
    scope: env_name == 'Acrobot-v1'
  - name: ddqn_acrobot_g0999
    base:
      gamma: 0.999
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
    scope: env_name == 'Acrobot-v1'
