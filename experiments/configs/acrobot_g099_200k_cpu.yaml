name: acrobot_g099_200k_cpu
out_dir: experiments/data/acrobot_g099_200k_cpu
env_binding: shared
archive_remote: s3://corroborate-archive/acrobot_g099_200k_cpu

# Acrobot γ=0.99 at 200k steps (vs canonical 100k), 50 bursts at
# eval_every=4000. Motivation: at canonical 100k, V and D both reach
# the optimal-solve regime intermittently but neither stabilises; the
# wide per-seed peak spread (a few seeds collapse below -200) drives
# the heterogeneity Layer 2 surfaces. 200k gives both arms time to
# stabilise post-anneal so the late-30% comparison reflects steady
# state rather than mid-convergence transient.
#
# Acrobot is stochastic (random init torque) → n_episodes=20 to
# average out env noise per burst.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true
keep_q_per_action: true

envs:
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  4000
  n_episodes:  20
  gamma:       0.99
  sync_period: 100
  n_step:      1
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000  # full anneal by mid-training, like canonical
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: canonical_g099_200k
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
