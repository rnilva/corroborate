name: k_sweep_breakout
out_dir: experiments/data/k_sweep_breakout
arms_shape: chunked

# action-duplicate (k) sweep on Breakout-MinAtar — policy-channel
# CONTROL for bias-channel verification. Pre-registered:
# d_out_DDQN should be INVARIANT to k IF policy-structure
# mediation holds (entropy is the mediator, not jens-magnitude).
# If d_out scales with √(log K), the entropy-mediation Finding
# is refuted (bias IS load-bearing after all).
#
# k ∈ {1, 4, 16} × 2 arms × 30 seeds × 1M = 180 cells.
envs:
  - {name: Breakout-MinAtar, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 1}]}
  - {name: Breakout-MinAtar, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 4}]}
  - {name: Breakout-MinAtar, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 16}]}

base_intervention:
  total_steps: 1000000
  eval_every:  100000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

hypotheses:
  - name: ddqn_vs_vanilla
    predicted_direction: a_gt_b
    intervention: {}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
