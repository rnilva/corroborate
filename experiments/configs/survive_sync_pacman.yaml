name: survive_sync_pacman
out_dir: experiments/data/survive_sync_pacman
arms_shape: paired

# PacMan-jumanji SURVIVE sweep at intermediate sync values.
# Companion to survive_sync_intermediate_minatar — same purpose:
# expand the SURVIVE strict-mech-HELD config set inside CLAIM 17
# scope (bounded Q + mech-active). PacMan is uniquely valuable
# because it has 5 actions (NOOP + 4 dirs), giving more
# argmax_entropy_van potential than 4-action MinAtar envs and
# directly testing the action-asymmetric Hasselt-bias hypothesis
# (CLAIM 20).
#
# 1 env × 3 sync × 2 arms × 30 seeds = 180 cells. CNN q_network.
envs:
  - {name: PacMan-jumanji, n_seeds: 30, chunk_size: 2}

base_intervention:
  total_steps: 50000
  eval_every:  5000
  n_episodes:  3
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [8, 16]
    kernel_size: 3
    hidden: [64]

hypotheses:
  - name: vanilla_dqn_sync500
    predicted_direction: null
    intervention: {sync_period: 500}
  - name: ddqn_sync500
    predicted_direction: a_gt_b
    intervention:
      sync_period: 500
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
  - name: vanilla_dqn_sync1500
    predicted_direction: null
    intervention: {sync_period: 1500}
  - name: ddqn_sync1500
    predicted_direction: a_gt_b
    intervention:
      sync_period: 1500
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
  - name: vanilla_dqn_sync3000
    predicted_direction: null
    intervention: {sync_period: 3000}
  - name: ddqn_sync3000
    predicted_direction: a_gt_b
    intervention:
      sync_period: 3000
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
