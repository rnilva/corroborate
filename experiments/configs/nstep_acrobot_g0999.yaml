name: nstep_acrobot_g0999
out_dir: experiments/data/nstep_acrobot_g0999
env_binding: shared
archive_remote: s3://corroborate-archive/nstep_acrobot_g0999

# Within-env n-step sweep on Acrobot at γ=0.999 wd=1e-4 — the regime
# where Acrobot's mechanism HELD (jens drops 29 → 14 in
# `findings_l2_acrobot_goldilocks`). Companion to
# `nstep_lambda_fourrooms` (which corroborated chain-depth
# mediator on FourRooms γ=0.99): tests whether the chain-depth
# mediator extends to dense-penalty + high-γ regime.
#
# Predictions (per chain-depth mediator hypothesis):
#   n=1 (full bootstrap, max chain depth): DDQN benefit large
#   n=10 (~MC, no bootstrap chain): DDQN benefit ~0
#   monotonic decline in between
#
# If chain-depth-mediator is universal, this should hold despite
# Acrobot being dense-penalty (the FourRooms result was
# sparse-positive). If chain-depth fails to predict on Acrobot,
# the mediator IS regime-dependent.
#
# 5 n × 1 env × 30 seeds × 2 arms = 10 arms × 200k steps.
# GPU runtime ~25-40 min.

envs:
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001, weight_decay: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: vanilla_n1
    base: {n_step: 1}
  - name: ddqn_n1
    base:
      n_step: 1
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: vanilla_n2
    base: {n_step: 2}
  - name: ddqn_n2
    base:
      n_step: 2
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: vanilla_n3
    base: {n_step: 3}
  - name: ddqn_n3
    base:
      n_step: 3
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: vanilla_n5
    base: {n_step: 5}
  - name: ddqn_n5
    base:
      n_step: 5
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: vanilla_n10
    base: {n_step: 10}
  - name: ddqn_n10
    base:
      n_step: 10
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
