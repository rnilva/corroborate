name: gamma_sweep_fourrooms_low
out_dir: experiments/data/gamma_sweep_fourrooms_low
arms_shape: chunked
archive_remote: s3://corroborate-archive/gamma_sweep_fourrooms_low

# Truncate effective_horizon: γ=0.80 → eff_h≈5, γ=0.50 → eff_h≈2.
# If chain-depth is the right reading, the FourRooms signature
# should DIE at very short eff_h. Falsification companion to the
# γ-up experiment on MetaMaze.
envs:
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    class: WarmedUpdate
    inner: {class: Adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: vanilla_dqn_g080
    predicted_direction: null
    intervention:
      gamma: 0.80
  - name: ddqn_g080
    predicted_direction: a_gt_b
    intervention:
      gamma: 0.80
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}

  - name: vanilla_dqn_g050
    predicted_direction: null
    intervention:
      gamma: 0.50
  - name: ddqn_g050
    predicted_direction: a_gt_b
    intervention:
      gamma: 0.50
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
