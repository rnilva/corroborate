name: alpha_x_K_fourrooms
out_dir: experiments/data/alpha_x_K_fourrooms
env_binding: shared
archive_remote: s3://corroborate-archive/alpha_x_K_fourrooms

# α × K factorial grid on FourRooms (fast MLP env).
# Pre-registered 2026-05-11 after Cat A substrate fix.
#
# Hypothesis under test: Hasselt 2010's σ × √(2 ln K) scaling.
# As K grows (action duplication), the argmax-noise bias bound
# grows. If DDQN's mechanism reduces argmax-noise specifically,
# DDQN's outcome benefit should scale with K (existing K=4→16
# data on FourRooms shows 6× DDQN benefit growth).
#
# This sweep adds the α-axis: continuous dampened_double_greedify
# at α ∈ {0.25, 0.5, 0.75} to see whether outcome's α-response
# also scales with K. P1 (linearity in α) on Breakout+SI showed
# flat outcome response at 200k; testing whether higher-K
# regime activates a measurable response.
#
# Cat A measurement: substrate now correctly computes
# `mean_t σ_action(s_t) × √(2 ln K)` via `online_std_q_per_step`.
# Inline analysis can also recompute Cat A from the σ column.
#
# Compute: 3 α treatments × 4 K-envs × 30 seeds × 200k steps
#        + 4 K-envs × 30 seeds × 200k (vanilla baselines)
#        = 480 cells. ~6-10 hours on CPU.
# n_episodes: 5 (matches action_dim_inflated_fourrooms_postfix cache;
# enables cache backfill of vanilla / DDQN endpoint cells if needed).
envs:
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30, wrappers: [{type: action_duplicate, k: 1}]}
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30, wrappers: [{type: action_duplicate, k: 2}]}
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30, wrappers: [{type: action_duplicate, k: 3}]}
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30, wrappers: [{type: action_duplicate, k: 4}]}

defaults:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: vanilla_dqn

  - name: dampened_a025
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.25}

  - name: dampened_a050
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.5}

  - name: dampened_a075
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.75}

  - name: dampened_a100
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 1.0}
