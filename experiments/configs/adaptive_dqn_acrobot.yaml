name: adaptive_dqn_acrobot
out_dir: experiments/data/adaptive_dqn_acrobot
arms_shape: chunked

envs:
  # Small MLP env — chunk_size=30 fits easily in GPU memory.
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 30}

# HPs match expectile_3way + nstep_intervention's Acrobot cells
# so adaptive_dqn pairs against existing vanilla_dqn + ddqn cells
# (seeds 0-29 align across all three corpora).
base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    class: WarmedUpdate
    inner: {class: Adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

# Single arm at the FourRooms-validated factor=0.5 threshold.
# Acrobot is a "DDQN-mildly-hurts" env (mean_d_final ≈ -2.4 raw
# return); the adaptive heuristic should land between vanilla
# and DDQN, ideally beating both.
hypotheses:
  - name: adaptive_dqn
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification:
          fn: adaptive_dormancy_greedify
          sigma_floor_factor: 0.5
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification:
            fn: adaptive_dormancy_greedify
            sigma_floor_factor: 0.5
