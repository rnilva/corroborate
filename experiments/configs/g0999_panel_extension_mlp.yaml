name: g0999_panel_extension_mlp
out_dir: experiments/data/g0999_panel_extension_mlp
env_binding: per_env
archive_remote: s3://corroborate-archive/g0999_panel_extension_mlp

# T3a γ=0.999 panel extension for MLP-state envs (Acrobot,
# LunarLander) at canonical HPs. Adds outcome-regime data
# points to the existing 4-env MinAtar panel.
#
# Companion: `g0999_panel_extension_jumanji.yaml` for PacMan +
# Snake at CNN HPs.
#
# Canonical HPs from `_PER_ENV_CANONICAL`:
# Acrobot/LunarLander: sync=100, cap=50000, hidden=(64,64),
# total_steps=1M.
#
# 2 envs × 1 γ × 2 arms × 30 seeds = 120 cells. Estimated 2-4h
# GPU at chunk_size=30 (vector envs are fast).

envs:
  - {name: Acrobot-v1,         n_seeds: 30, chunk_size: 30}
  - {name: LunarLander-v2-jax, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: "g0999_{from_env: name}"
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
