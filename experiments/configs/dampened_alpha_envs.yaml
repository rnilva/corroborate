name: dampened_alpha_envs
out_dir: experiments/data/dampened_alpha_envs
arms_shape: chunked
archive_remote: s3://corroborate-archive/dampened_alpha_envs

# Continuous-α intervention extended across the 4
# `action_dim_at_low_rs` envs at the rescue-regime reward scale.
#
# Replaces the brittle vanilla-vs-DDQN A/B with a 5-point α
# response curve per env. The dependent variable is the SLOPE of
# Q-bias / outcome / activation-rate against α — not a pairwise
# Δ. Lets us test whether DDQN's bias correction is a continuous
# mechanism (linear in α) or a switch (only fires at α=1).
#
# Mirrors action_dim_at_low_rs (4 envs × rs=0.1) but with α as
# the varying factor instead of the binary algorithm choice.
#
# 5 α × 4 envs × 30 seeds × 200k steps = 20 arms. CPU runtime
# ~2-3 min/arm × 20 = ~50 min.
envs:
  - {name: DeepSea-bsuite,          n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 0.1}]}
  - {name: FourRooms-misc,          n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 0.1}]}
  - {name: DiscountingChain-bsuite, n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 0.1}]}
  - {name: MNISTBandit-bsuite,      n_seeds: 30, chunk_size: 10, wrappers: [{type: reward_scale, scale: 0.1}]}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    class: WarmedUpdate
    inner: {class: Adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: dampened_a000
    predicted_direction: null
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: dampened_double_greedify, alpha: 0.0}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: dampened_double_greedify, alpha: 0.0}

  - name: dampened_a025
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: dampened_double_greedify, alpha: 0.25}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: dampened_double_greedify, alpha: 0.25}

  - name: dampened_a050
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: dampened_double_greedify, alpha: 0.5}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: dampened_double_greedify, alpha: 0.5}

  - name: dampened_a075
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: dampened_double_greedify, alpha: 0.75}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: dampened_double_greedify, alpha: 0.75}

  - name: dampened_a100
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: dampened_double_greedify, alpha: 1.0}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: dampened_double_greedify, alpha: 1.0}
