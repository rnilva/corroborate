name: spaceinvaders_no_hit_penalty
out_dir: experiments/data/spaceinvaders_no_hit_penalty
env_binding: per_env
archive_remote: s3://corroborate-archive/spaceinvaders_no_hit_penalty

# Pearl-rung-2 mechanism test: does DDQN's per-burst attenuation
# on SpaceInvaders depend on the negative-reward stochasticity?
#
# SpaceInvaders-MinAtar reward: +1 per kill, −1 per hit (stochastic
# enemy fire timing). Among 4 MinAtar envs, ONLY SpaceInvaders has
# stochastic neg-reward, AND ONLY SpaceInvaders shows DDQN's
# per-burst attenuation (mc_diff = −1.13, g_link = −0.56 on
# minatar_1M). Eliminative argument identifies neg-reward
# stochasticity as the candidate mechanism.
#
# Test: clip step reward to max(reward, 0) — strips the negative
# side. Predict: DDQN's per-burst attenuation DISAPPEARS,
# confirming the neg-reward-stochasticity mechanism.
#
# 1 env × 2 conditions × 2 arms × 30 seeds at 1M steps.
# chunk_size=10 (pixel env replay tensor).
# 2 × 2 × 3 chunks = 12 arms.
#
# HPs match the working `minatar_1M_spaceinvaders.yaml` (CNN
# kernel_size=3, capacity=50000) so the only varied factor is
# the reward clip.

envs:
  - {name: SpaceInvaders-MinAtar, n_seeds: 30, chunk_size: 10}
  - {name: SpaceInvaders-MinAtar, n_seeds: 30, chunk_size: 10, wrappers: [{type: reward_clip, clip_min: 0.0}]}

defaults:
  total_steps: 1000000
  eval_every:  50000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: vanilla_dqn

  - name: ddqn
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
