name: pacman_jumanji_smoke
out_dir: experiments/data/pacman_jumanji_smoke
arms_shape: paired

# Smoke test for PacMan-jumanji integration. 31×28×5 multi-channel
# grid (walls/pacman/ghosts/pellets/power-ups), 5 actions
# (NOOP+4 dirs), time_limit=1000. SURVIVE polarity: per-step
# pellet reward, episode terminates on ghost contact.
envs:
  - {name: PacMan-jumanji, n_seeds: 1, chunk_size: 1}

base_intervention:
  total_steps: 2000
  eval_every:  1000
  n_episodes:  1
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [64]

hypotheses:
  - name: ddqn_vs_vanilla_smoke
    predicted_direction: a_gt_b
    intervention: {}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
