name: seaquest_canonical_g0999
out_dir: experiments/data/seaquest_canonical_g0999
env_binding: per_env
archive_remote: s3://corroborate-archive/seaquest_canonical_g0999

# Seaquest (pgx-backed MinAtar) at γ=0.999, canonical MinAtar HPs.
# 1 env × 1 γ × 2 arms × 30 seeds = 60 cells, ~2-4 hours GPU.
#
# Seaquest fills a gap in our γ=0.999 panel — the gymnax MinAtar
# suite (Asterix / Breakout / Freeway / SpaceInvaders) doesn't
# include Seaquest, and Seaquest is the only MinAtar env with a
# multi-objective tension (oxygen + score), making it a useful
# test for the cross-env loop-mediation hypothesis.
#
# HPs match minatar_gamma_sweep_k1.yaml so cross-env comparison
# is config-controlled.

envs:
  - {name: Seaquest-MinAtar, n_seeds: 30, chunk_size: 5}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.999
  sync_period: 1000
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: "g0999_{from_env: name}"
    base: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
