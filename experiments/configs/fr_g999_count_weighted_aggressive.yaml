name: fr_g999_count_weighted_aggressive
out_dir: experiments/probes/fr_g999_count_weighted_aggressive
env_binding: shared
archive_remote: s3://corroborate-archive/fr_g999_count_weighted_aggressive
merge_top_level: false

# Follow-up to fr_g999_count_weighted.yaml — α=1 was near-vanilla,
# α=2 showed real movement on late_window (0.067 → 0.370). Test
# whether more aggressive α captures more of DDQN's benefit.
#
# 4 arms × 30 seeds × 100k steps × 50 bursts.
#
# Predictions:
# - If loop-channel is the sole DDQN mechanism: outcome → DDQN
#   monotonically as α increases.
# - If loop-channel is one of several: outcome saturates somewhere
#   between vanilla and DDQN.
# - If too-aggressive starves the agent: outcome could turn back
#   toward vanilla at very high α (U-shape).

envs:
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 100000
  eval_every:  2000
  n_episodes:  5
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 10000

interventions:
  - name: alpha_sweep
    base: {}
    arms:
      # arm 0: α=3.0
      - - slot_path: count_weight_alpha
          replacement: 3.0
      # arm 1: α=5.0
      - - slot_path: count_weight_alpha
          replacement: 5.0
      # arm 2: α=10.0
      - - slot_path: count_weight_alpha
          replacement: 10.0
      # arm 3: DDQN + α=2.0 (combo — does count-weight stack on DDQN?)
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
        - slot_path: count_weight_alpha
          replacement: 2.0
