name: fr_g999_alpha_5to8_200k
out_dir: experiments/probes/fr_g999_alpha_5to8_200k
env_binding: shared
archive_remote: s3://corroborate-archive/fr_g999_alpha_5to8_200k
merge_top_level: false

# Refined α dose-response at FR γ=0.999 × 200k (2× the 100k
# corpus, to give count-weighted variants more training time).
# Includes DDQN at 200k as anchor.
#
# Prior result at 100k (memory:
# findings_count_weighted_recovers_ddqn_benefit_at_fr_g999):
#   α=5 was the sweet spot. Recovers ~80% of DDQN's
#   late_window benefit but only ~26% of eval_final.
#   α=10 catastrophically over-regularizes.
#
# At 200k, hoping to see:
#   - Sharper peak around α=5-8
#   - Reduced eval_final gap (more training time to anchor)
#   - More stable late_window dose-response
#
# 5 arms × 30 seeds × 200k = ~25 min on CPU.

envs:
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  4000           # 50 bursts at 200k
  n_episodes:  5
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 10000

interventions:
  - name: alpha_5to8
    base: {}
    arms:
      # arm 0: α=5
      - - slot_path: count_weight_alpha
          replacement: 5.0
      # arm 1: α=6
      - - slot_path: count_weight_alpha
          replacement: 6.0
      # arm 2: α=7
      - - slot_path: count_weight_alpha
          replacement: 7.0
      # arm 3: α=8
      - - slot_path: count_weight_alpha
          replacement: 8.0
      # arm 4: DDQN at 200k (anchor)
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
