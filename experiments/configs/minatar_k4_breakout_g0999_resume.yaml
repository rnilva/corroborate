name: minatar_k4_breakout_g0999_resume
out_dir: experiments/data/minatar_k4_breakout_g0999_resume
env_binding: per_env
archive_remote: s3://corroborate-archive/minatar_k4_breakout_g0999_resume

# Resume of the crashed minatar_gamma_sweep_k4 sweep — specifically
# the 10 missing seeds (20..29) for Breakout-MinAtar γ=0.999 × k=4.
#
# Context: the original sweep (`minatar_gamma_sweep_k4`) crashed at
# 08:52:53 on 2026-05-20 with CUDA_ERROR_LAUNCH_FAILED during the
# per-cell parquet merge for g0999_Breakout. The corpus got 40 rows
# (20 seeds × 2 arms) instead of the intended 60 rows (30 × 2). Runs
# + traces are coherent at n=20/arm but lower-power than the rest of
# the panel.
#
# This resume runs seeds 20..29 only (seed_offset=20, n_seeds=10) so
# the union with the original g0999_Breakout-MinAtar/runs.parquet
# reaches n=30/arm at analysis time. Other env-γ blocks (Freeway, SI)
# are handled by a separate resume config.
#
# Cells: 1 env × 1 γ × 2 arms = 2 cells, each vmapping 10 seeds.
# Est wall on GPU: ~80 min/cell × 2 = ~2.7h.

envs:
  - {name: Breakout-MinAtar, n_seeds: 10, chunk_size: 10, seed_offset: 20,
     wrappers: [{type: action_duplicate, k: 4}]}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: "g0999_{from_env: name}"
    base: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
