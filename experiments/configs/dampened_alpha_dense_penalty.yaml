name: dampened_alpha_dense_penalty
out_dir: experiments/data/dampened_alpha_dense_penalty
env_binding: shared
archive_remote: s3://corroborate-archive/dampened_alpha_dense_penalty

# α sweep on DENSE-PENALTY GOAL envs (Acrobot + MountainCar) at
# DEFAULT config (no reward_scale, sync=100, γ=0.99). Direct
# within-env test of mechanism direction:
#   α = 0   → vanilla (max-bootstrap, no DDQN correction)
#   α = 1.0 → full DDQN (Hasselt's argmax/max separation)
#   α ∈ (0, 1) → continuous interpolation
#
# Mirrors `dampened_alpha_envs.yaml` for the sparse-positive
# regime; this is the missing dense-penalty companion. The
# `findings_dampened_alpha_envs` memory established
# slope(α → outcome) = +0.049, t = +13.4 on FourRooms — clean
# positive monotone mechanism. This sweep tests whether the
# slope is positive, negative, or null on dense-penalty.
#
# 5 α × 2 envs × 30 seeds × 200k steps = 300 cells.
# GPU runtime ~10-15 min total.

envs:
  - {name: Acrobot-v1,     n_seeds: 30, chunk_size: 30}
  - {name: MountainCar-v0, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: dampened_a000
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.0}

  - name: dampened_a025
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.25}

  - name: dampened_a050
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.5}

  - name: dampened_a075
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.75}

  - name: dampened_a100
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 1.0}
