name: ddqn_effective_cohort
out_dir: experiments/data/ddqn_effective_cohort
arms_shape: paired

envs:
  - {name: Asterix-MinAtar,        n_seeds: 30, chunk_size: 10}
  - {name: Breakout-MinAtar,       n_seeds: 30, chunk_size: 10}
  - {name: SpaceInvaders-MinAtar,  n_seeds: 30, chunk_size: 10}
  - {name: Freeway-MinAtar,        n_seeds: 30, chunk_size: 10}
  - {name: MNISTBandit-bsuite,     n_seeds: 30, chunk_size: 10}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    class: WarmedUpdate
    inner: {class: Adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [128]

hypotheses:
  - name: vanilla_dqn
    predicted_direction: null

  - name: ddqn
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
