name: g0999_panel_extension_pacman_only
out_dir: experiments/data/g0999_panel_extension_pacman_only
env_binding: per_env
archive_remote: s3://corroborate-archive/g0999_panel_extension_pacman_only

# T3a γ=0.999 panel extension — PacMan-jumanji only. Filtered from
# the bundled `g0999_panel_extension_jumanji.yaml`.
#
# Closes pre-registration PR-5: PacMan bin classification under the
# 4-bin regime classifier × 2 predictors test. Adds 1 stratum to the
# σ_Λ_a moderation panel at γ=0.999 k=1.
#
# Canonical Jumanji HPs from `_PER_ENV_CANONICAL`:
# PacMan-jumanji: sync=1000, cap=50000, hidden=(64),
# channels=(8,16), total_steps=1M.
#
# 1 env × 1 γ × 2 arms × 30 seeds = 2 cells. ~3-4h GPU.
# Chained after Snake γ=0.999 (also from T3a panel extension).

envs:
  - {name: PacMan-jumanji, n_seeds: 30, chunk_size: 2}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.999
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [8, 16]
    kernel_size: 3
    hidden: [64]

interventions:
  - name: "g0999_{from_env: name}"
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
