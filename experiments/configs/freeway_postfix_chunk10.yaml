name: freeway_postfix_chunk10
out_dir: experiments/data/freeway_postfix_chunk10
arms_shape: paired

# Freeway-only postfix sync sweep at chunk_size=10 to avoid the
# OOM during XLA compile we hit at chunk=30. Companion to
# `survive_sync_freeway_si_chunk10` which only completed
# SpaceInvaders.
envs:
  - {name: Freeway-MinAtar, n_seeds: 30, chunk_size: 10}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [128]

hypotheses:
  - name: vanilla_dqn_sync500
    predicted_direction: null
    intervention: {sync_period: 500}
  - name: ddqn_sync500
    predicted_direction: a_gt_b
    intervention:
      sync_period: 500
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
  - name: vanilla_dqn_sync1500
    predicted_direction: null
    intervention: {sync_period: 1500}
  - name: ddqn_sync1500
    predicted_direction: a_gt_b
    intervention:
      sync_period: 1500
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
  - name: vanilla_dqn_sync3000
    predicted_direction: null
    intervention: {sync_period: 3000}
  - name: ddqn_sync3000
    predicted_direction: a_gt_b
    intervention:
      sync_period: 3000
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
