name: synthetic_bias_typeb_v3_1_pilot
out_dir: experiments/data/synthetic_bias_typeb_v3_1_pilot
env_binding: per_env
archive_remote: s3://corroborate-archive/synthetic_bias_typeb_v3_1_pilot

# v3.1 synthetic bias Type-A/B controlled-substrate sweep.
#
# v1 → v2 → v3 → v3.1 evolution lives in:
# - docs/PRE_REGISTRATION_synthetic_bias_typeb.md
# - /tmp/synthetic_env_roast.md  (v1 critique)
# - /tmp/synthetic_v2_roast.md   (v2 critique)
# - /tmp/synthetic_v3_review.md  (v3 critique)
#
# v1 scrapped (action-independent transitions). v2 scrapped
# (per-step reward-noise α conflated with Q-target-side
# Var_a[V*(s')]; |Q*| 50× under natural-env scale; n_seeds=12
# under-powered; L=64 hidden=[32,32] over-parameterized).
# v3 scrapped pre-launch (`/tmp/synthetic_v3_review.md`):
# state-baked `mu_state(s) = peak·β^(s mod K)` gave
# `Var_a[V*(s'_a)] = 0` identically (modular periodicity); Q*
# had only K=4 distinct values across L=1024 states. v3 was the
# SAME conceptual error as v2 (per-step reward variance vs
# Q-target-side variance), just relocated.
#
# v3.1 fix: RANDOM per-state payoffs
# `mu_state[s] = peak · (1 - spread + spread · U_s)` with
# `U_s ~ U(0, 1)` seeded by `payoff_seed`. Value iteration
# confirms `Var_a[V*(s'_a)] > 0` at every spread > 0 (monotone)
# AND Q* has ~L distinct entries (no modular collapse). The L
# axis now genuinely binds FA capacity.
#
# Panel: 30 envs × 3 γ × 2 arms × 8 seeds = 1440 cells (≤ 1500
# budget). Cell budget binds because the 30-env count carries
# more cross-realisation averaging (3 payoff_seeds × 5 spreads ×
# 2 L) — we trade per-cell seed replication for env-level
# replication to keep the panel size bounded.
#
# Pre-registered bridges — sweep-launch commitments captured in
# `<out_dir>/pre_registration.json`. Each entry locks the bridge's
# source-hash, predicted direction, and predicted verdict at the
# git HEAD as of sweep launch. Post-sweep `corroborate audit
# pre-registration <corpus>` re-resolves each bridge against the
# corpus and reports source-hash drift OR verdict drift.
#
# These commitments encode the substantive predictions from
# `docs/PRE_REGISTRATION_synthetic_bias_typeb.md`:
#   P1 (PRIMARY): ρ(payoff_spread, d_out) ≤ −0.5 pooled
#       (n_strata=90; HELD predicted)
#   D2 (DIAGNOSTIC): ρ(payoff_spread, d_out) ≤ −0.6 at γ=0.999
#       (n_strata=30 at single γ but covariate spread axis
#       limited; PRE-REGISTERED VERDICT = POWER_INSUFFICIENT
#       — addresses v3 reviewer's discipline issue #1, where
#       v3 had `predicted_verdict: held` despite docstring
#       saying STRUCTURAL POWER_INSUFFICIENT)
#   N1: |ρ(L, d_out)| < 0.30 AND p > 0.30 at spread=0
#       (n_strata=18; HELD-as-null predicted)
pre_registered_bridges:
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.ddqn_harms_under_high_spread__synthetic_typeb_v31
    predicted_direction: a_lt_b
    predicted_verdict: held
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.ddqn_harm_amplified_at_g999__synthetic_typeb_v31
    predicted_direction: a_lt_b
    predicted_verdict: power_insufficient
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.n_states_alone_does_not_drive_dout__synthetic_typeb_v31
    predicted_direction: 'null'
    predicted_verdict: held

# 30 v3.1 envs: 2 n_states × 5 payoff_spread × 3 payoff_seed.
envs:
  # L=32 × 5 spreads × 3 seeds.
  - {name: TypeBChainV31-K4-L32-spread0.0-seed0-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread0.0-seed1-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread0.0-seed2-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread0.25-seed0-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread0.25-seed1-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread0.25-seed2-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread0.5-seed0-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread0.5-seed1-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread0.5-seed2-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread0.75-seed0-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread0.75-seed1-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread0.75-seed2-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread1.0-seed0-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread1.0-seed1-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L32-spread1.0-seed2-synthetic, n_seeds: 8, chunk_size: 4}
  # L=1024 × 5 spreads × 3 seeds.
  - {name: TypeBChainV31-K4-L1024-spread0.0-seed0-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread0.0-seed1-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread0.0-seed2-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread0.25-seed0-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread0.25-seed1-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread0.25-seed2-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread0.5-seed0-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread0.5-seed1-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread0.5-seed2-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread0.75-seed0-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread0.75-seed1-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread0.75-seed2-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread1.0-seed0-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread1.0-seed1-synthetic, n_seeds: 8, chunk_size: 4}
  - {name: TypeBChainV31-K4-L1024-spread1.0-seed2-synthetic, n_seeds: 8, chunk_size: 4}

defaults:
  # 200k steps to give the L=1024 FA-binding corner adequate
  # convergence time. At L=32, 200k steps × batch=32 gives ~6.4M
  # training tuples → each (s,a) sees ~50k updates (well-converged).
  # At L=1024, ~1.5k updates per (s,a) — Q is partially-learned,
  # which is the FA-binding regime v3.1 tests.
  total_steps: 200000
  eval_every:  10000
  n_episodes:  10
  gamma:       0.99
  sync_period: 500
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0003}
    warmup_steps: 200
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 80000
  q_network:
    class: MLP
    # Single hidden layer of 16 units. At L=1024 with random
    # per-state payoffs (v3.1), the MLP must alias ~1024 distinct
    # V*-values through 16 hidden units (64 V*-values per unit) —
    # genuine FA-binding regime. v3's L=1024 corner only had K=4
    # distinct V*-values (modular collapse); 16-dim hidden
    # trivially represented them. v3.1 fixes this.
    hidden: [16]

# γ × DDQN-vs-vanilla cross. Each γ level has 2 arms (vanilla
# baseline + DDQN treatment); the YAML expands to 3 γ × 2 arms ×
# 30 envs × 8 seeds = 1440 cells via env_binding=per_env.
interventions:
  - name: "g095_{from_env: name}"
    base: {gamma: 0.95}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: "g099_{from_env: name}"
    base: {gamma: 0.99}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: "g0999_{from_env: name}"
    base: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
