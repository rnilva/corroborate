name: asterix_g0999_adamw_wd1e2_ckpt
out_dir: experiments/data/asterix_g0999_adamw_wd1e2_ckpt
env_binding: shared
archive_remote: s3://corroborate-archive/asterix_g0999_adamw_wd1e2_ckpt

# Dose-response point: wd=1e-2 (10× stronger than wd=1e-3 finding).
# Tests whether wd=1e-3's 77% harm reduction can be amplified or
# whether wd=1e-2 over-regularizes (eval collapses for both arms).
#
# Predictions:
#   - If "soft trajectory damping" scales monotonically: wd=1e-2 should
#     either further reduce harm OR begin to suppress peak eval
#   - If wd=1e-3 was optimal: V's eval drops noticeably (over-regularized)
#     and d_raw may swing positive (D's harm goes away but V also degrades)
#   - If wd=1e-2 is way too strong: both arms collapse to <5 eval, d_raw
#     near zero by floor effect

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true

envs:
  - {name: Asterix-MinAtar, n_seeds: 15, chunk_size: 15}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.999
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001, weight_decay: 0.01}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: adamw_wd1e2
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
