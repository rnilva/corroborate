name: fa_linear_extra_envs
out_dir: experiments/probes/fa_linear_extra_envs
env_binding: shared
archive_remote: s3://corroborate-archive/fa_linear_extra_envs

# Extension of C2's "linear FA caps Type 1 across envs" panel to
# three light envs that aren't currently represented. C2's
# null_ceiling was tightened from 0.5 → 0.3 (Cohen's "small"
# threshold) on 2026-05-16; MetaMaze's d=-0.24 CI=[-0.42, -0.06]
# now straddles -0.3 → POWER_INSUFFICIENT. Adding 3 new strata
# probes whether the FA-cap claim generalizes beyond the 4
# overshoot-prone envs (FR, Acrobot, MetaMaze, MountainCar).
#
# Cells: 3 envs × 2 γ × 2 arms × 60 seeds = 720 cells.
# Linear FA ONLY (q_network.hidden=[]) — we don't need MLP
# baselines for C2's panel and avoiding them keeps the sweep
# cheap. Existing FR/Acrobot/MM/MC linear cells stay in cache;
# this sweep adds to them without re-running.
#
# Cost on GPU: light envs at 200k steps ≈ 1-2 min/cell ×
# chunk_size=30 → 24 chunks (or fewer with parallel cells per
# chunk). Wall ~30-60 min.

envs:
  - {name: CartPole-v1,    n_seeds: 60, chunk_size: 30}
  - {name: Catch-bsuite,   n_seeds: 60, chunk_size: 30}
  - {name: DeepSea-bsuite, n_seeds: 60, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: []     # linear FA — the C2 panel's FA-cap regime

interventions:
  - name: g099
    base: {gamma: 0.99}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: g0999
    base: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
