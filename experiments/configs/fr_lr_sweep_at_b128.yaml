name: fr_lr_sweep_at_b128
out_dir: experiments/probes/fr_lr_sweep_at_b128
env_binding: shared
archive_remote: s3://corroborate-archive/fr_lr_sweep_at_b128

merge_top_level: false

# Tests the α/√B effective-noise hypothesis vs pure-B effect from
# `fr_batch_size_sweep` (commit b843ef0).
#
# Pre-registered hypothesis: the "B-effect on jens" we observed
# (ρ(B, jens) = -0.83) is actually mediated by effective gradient
# noise α/√B, not by B per se. At fixed B=128, varying α should
# produce the same jens-shifting effect.
#
# Prediction table (at B=128, varying α). The α values are chosen
# so that each α/√B EXACTLY MATCHES the canonical α/√B value at
# some reference B in the existing data:
#
#   α       α/√B    matches canonical scope             predicted jens
#   2.5e-5  2.21e-6 (α=1e-4, B=2048) from lemma4 sweep    ≈ 1.5
#   1e-4    8.84e-6 (α=1e-4, B=128 ) from lemma4 sweep    ≈ 4.5
#   2e-4    1.77e-5 (α=1e-4, B=32  ) canonical default    ≈ 12  ← critical test
#
# Math for the 3rd row: to match canonical B=32 effective-noise
# α/√B = 0.0001/√32 = 1.77e-5, at B=128 we need
# α = 1.77e-5 × √128 = 1.77e-5 × 11.31 = 2.0e-4.
#
# If jens(α=2e-4, B=128) ≈ jens(α=1e-4, B=32 canonical) ≈ 12,
# then α/√B is the controlling variable and Lemma 4's expectation
# invariance holds at constant effective-noise — the apparent
# refutation was a confound between B variation and effective-noise
# variation under fixed α.
#
# Alternative outcome: jens(α=4e-4, B=128) ≠ jens(B=32 canonical).
# Then B has structural effects beyond effective noise (e.g.,
# minibatch composition, sample selection bias from replay) that
# matter at finite training.
#
# Cells: 30 seeds × 2 arms × 3 α levels = 180 cells.
# Wall time ≈ 4.5h on CPU (same B=128, same total_steps as lemma4 sweep).
#
# Same canonical FR γ=0.999 MLP[64,64] unshaped setup. Replay
# batch_size = 128 (matches the lemma4 reference cell).

pre_registered_bridges:
  - bridge: experiments.findings.lemma4_batch_invariance.bridges.lr_drives_jens_up__fr_b128_g999_vanilla
    predicted_direction: a_gt_b
    predicted_verdict: held

envs:
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 1000000
  eval_every:  100000
  n_episodes:  5
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 128
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 10000

interventions:
  - name: lr_2.5e-5
    base:
      optimizer:
        fn: warmed_update
        inner: {fn: adam, lr: 0.000025}
        warmup_steps: 100
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: lr_1e-4
    base:
      optimizer:
        fn: warmed_update
        inner: {fn: adam, lr: 0.0001}
        warmup_steps: 100
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: lr_2e-4
    base:
      optimizer:
        fn: warmed_update
        inner: {fn: adam, lr: 0.0002}
        warmup_steps: 100
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
