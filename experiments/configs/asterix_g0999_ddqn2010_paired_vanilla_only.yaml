name: asterix_g0999_ddqn2010_paired_vanilla_only
out_dir: experiments/data/asterix_g0999_ddqn2010_paired
env_binding: shared

# Vanilla-only arm for the paired ddqn2010 sweep. deep2010 already
# completed and is archived at
#   s3://corroborate-archive/asterix_g0999_ddqn2010_paired/deep2010/
# This config runs ONLY the matched-seed vanilla reference. The out_dir
# is the shared parent so both sub-corpora end up co-located.

keep_q_checkpoint_per_burst: false
keep_q_checkpoint_final: false
archive_remote: s3://corroborate-archive/asterix_g0999_ddqn2010_paired
gradient_probes: false

envs:
  - {name: Asterix-MinAtar, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.999
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: vanilla
    base: {}
    arms:
      - []
