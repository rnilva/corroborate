name: sync_probe_lunarlander_canonical
out_dir: experiments/probes/sync_probe_lunarlander_canonical
env_binding: shared
archive_remote: s3://corroborate-archive/sync_probe_lunarlander_canonical

merge_top_level: false

# Sync-period (target-network update interval) probe on LunarLander
# γ=0.99 at OTHERWISE canonical T3a HPs (lr=1e-4, batch=32, [64,64],
# 1M steps). Tests whether the target-sync gap is load-bearing for
# the canonical-HP LL failure.
#
# Context:
# - canonical sync=100; SB3-zoo recipe uses 250
# - canonical T3a at lr=1e-4 + b=32 → V_late=135, fails to solve
# - per the n_envs investigation: SB3 trains 100k env steps with
#   UTD=0.25, target_update=250; we train 1M with UTD=1.0, sync=100.
#   Reducing sync_period frequency (= raising sync) is the cheapest
#   way to mimic SB3's "less stale-Q-target chasing" regime.
#
# Cells: 1 env × 4 sync × 2 arms = 8 cells. n_seeds=5 vmapped (fast
# iteration). Wall ≈ ~10-12 min/cell × 8 ≈ ~80-100 min on CPU.

envs:
  - {name: LunarLander-v2-jax, n_seeds: 5, chunk_size: 5}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000

interventions:
  - name: sync_100_canonical
    base: {sync_period: 100}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: sync_250_sb3
    base: {sync_period: 250}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: sync_500
    base: {sync_period: 500}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: sync_1000
    base: {sync_period: 1000}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
