name: synthetic_bias_typeb_pilot
out_dir: experiments/data/synthetic_bias_typeb_pilot
env_binding: per_env
archive_remote: s3://corroborate-archive/synthetic_bias_typeb_pilot

# Pre-registered bridges — sweep-launch commitments captured in
# `<out_dir>/pre_registration.json`. Each entry locks the bridge's
# source-hash, predicted direction, and predicted verdict at the
# git HEAD as of sweep launch. Post-sweep `corroborate audit
# pre-registration <corpus>` re-resolves each bridge, re-runs it
# against the corpus, and reports source-hash drift OR verdict
# drift — the framework-typed honest-reporting surface.
#
# These commitments encode the substantive predictions from
# `docs/PRE_REGISTRATION_synthetic_bias_typeb.md`:
#   P1: ρ(rvs, d_out) ≤ −0.5 p ≤ 0.05 (HELD-direction='a_lt_b')
#   N1: |ρ(sparsity, d_out)| ≤ 0.2 (HELD under
#       `predicted_direction='null'` — pytest-xfail analog)
pre_registered_bridges:
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.ddqn_harms_under_high_rvs__synthetic_typeb
    predicted_direction: a_lt_b
    predicted_verdict: held
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.sparsity_alone_does_not_predict_dout__synthetic_typeb
    predicted_direction: 'null'
    predicted_verdict: held

# Synthetic bias Type-A/B causal-test pilot.
#
# 12 synthetic envs span the (reward_variance_scale, reward_sparsity,
# reward_noise_scale) grid at fixed K=4, n_states=4, horizon=64.
# Each env has cleanly-controlled Var_a[Q*] by construction
# (proportional to (rvs × sp)²); the sweep tests whether DDQN-vs-
# vanilla d_out correlates with the structural Var_a[Q*] feature.
#
# γ is INHERITED from the substrate's standard γ sweep — here we
# fix γ=0.99 in defaults; future companion sweeps can run γ ∈
# {0.95, 0.999} for the γ × env-feature cross-axis.
#
# Cells: 12 envs × 2 arms × 15 seeds = 360. Tabular env on CPU is
# fast (~10s/cell, ~1h total). Sized for quick first-light;
# upgrade to n=30 + γ sweep once the pilot validates the
# substrate path.

envs:
  - {name: TypeBChain-K4-rvs0.2-sp0.2-ns0.1-synthetic, n_seeds: 15, chunk_size: 15}
  - {name: TypeBChain-K4-rvs0.2-sp0.2-ns0.5-synthetic, n_seeds: 15, chunk_size: 15}
  - {name: TypeBChain-K4-rvs0.2-sp1.0-ns0.1-synthetic, n_seeds: 15, chunk_size: 15}
  - {name: TypeBChain-K4-rvs0.2-sp1.0-ns0.5-synthetic, n_seeds: 15, chunk_size: 15}
  - {name: TypeBChain-K4-rvs1.0-sp0.2-ns0.1-synthetic, n_seeds: 15, chunk_size: 15}
  - {name: TypeBChain-K4-rvs1.0-sp0.2-ns0.5-synthetic, n_seeds: 15, chunk_size: 15}
  - {name: TypeBChain-K4-rvs1.0-sp1.0-ns0.1-synthetic, n_seeds: 15, chunk_size: 15}
  - {name: TypeBChain-K4-rvs1.0-sp1.0-ns0.5-synthetic, n_seeds: 15, chunk_size: 15}
  - {name: TypeBChain-K4-rvs3.0-sp0.2-ns0.1-synthetic, n_seeds: 15, chunk_size: 15}
  - {name: TypeBChain-K4-rvs3.0-sp0.2-ns0.5-synthetic, n_seeds: 15, chunk_size: 15}
  - {name: TypeBChain-K4-rvs3.0-sp1.0-ns0.1-synthetic, n_seeds: 15, chunk_size: 15}
  - {name: TypeBChain-K4-rvs3.0-sp1.0-ns0.5-synthetic, n_seeds: 15, chunk_size: 15}

defaults:
  total_steps: 50000
  eval_every:  2500
  n_episodes:  10
  gamma:       0.99
  sync_period: 200
  replay:
    class: Replay
    capacity: 10000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0003}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 20000
  q_network:
    class: MLP
    hidden: [32, 32]

interventions:
  - name: "ddqn_vs_vanilla_{from_env: name}"
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
