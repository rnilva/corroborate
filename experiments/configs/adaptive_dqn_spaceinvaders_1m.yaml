name: adaptive_dqn_spaceinvaders_1m
out_dir: experiments/data/adaptive_dqn_spaceinvaders_1m
env_binding: per_env

envs:
  # CNN at 1M — chunk_size: 15 to stay within GPU memory (matches
  # the working minatar_1M_spaceinvaders config).
  - {name: SpaceInvaders-MinAtar, n_seeds: 30, chunk_size: 15}

# HPs match minatar_1M's SpaceInvaders cells (vanilla_dqn + ddqn
# already there). Pair adaptive arm against those existing cells.
defaults:
  total_steps: 1000000
  eval_every:  50000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [128]

# Single arm — the winning factor=0.5 from the FourRooms tuning.
interventions:
  - name: adaptive_dqn
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification:
              fn: adaptive_dormancy_greedify
              sigma_floor_factor: 0.5
