name: metamaze_g999_smoothness_rerun
out_dir: experiments/data/metamaze_g999_smoothness_rerun
env_binding: shared
archive_remote: s3://corroborate-archive/metamaze_g999_smoothness_rerun

# MetaMaze γ=0.999 CPU rerun with current substrate to populate
# the smoothness measurable (`q_inter_state_grad_overlap_late`)
# AND the fixed state_hash (obs[:14] — 14 spatial bits, ignoring
# the dim-14 time-counter that made every step "unique" in the
# prior sweep's hash). Adds MM as the 9th canonical-pool env for
# the cross-env smoothness sign-alignment claim.
#
# Pre-existing MM corpora (`metamaze_canonical_verify`,
# `ddqn_axis_probes_metamaze_1m`) pre-date 2026-05-13 probe
# addition → 0 finite smoothness values.
#
# Cells: 30 seeds × 2 arms × 1 γ = 60 cells. CPU device.

envs:
  - {name: MetaMaze-misc, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 1000000
  eval_every:  100000
  n_episodes:  20
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: g0999
    base: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
