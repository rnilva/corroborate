name: acrobot_dense_eval_k_sweep
out_dir: experiments/data/acrobot_dense_eval_k_sweep
env_binding: shared

# Dense-eval probe of Acrobot transient phase before outcome
# saturation. At canonical eval_every=100000, burst 0 is already
# at-or-near saturation for k=1, k=4 (memory
# `findings_per_burst_acrobot_k_sweep`). Dense eval at every 5k
# steps captures the unsaturated early-learning curve.
#
# 200k steps × eval_every=5k → 40 bursts. n_seeds=30 chunk=30
# (single chunk per arm). 3 k × 2 arms = 6 cells. Acrobot
# MLP[64,64] on CPU is fast (~1-2 min/cell), total ~15 min.

envs:
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 30, wrappers: [{type: action_duplicate, k: 1}]}
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 30, wrappers: [{type: action_duplicate, k: 4}]}
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 30, wrappers: [{type: action_duplicate, k: 16}]}

defaults:
  total_steps: 200000
  eval_every:  5000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: ddqn_vs_vanilla
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
