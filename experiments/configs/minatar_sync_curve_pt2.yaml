name: minatar_sync_curve_pt2
out_dir: experiments/data/minatar_sync_curve_pt2
arms_shape: paired
archive_remote: s3://corroborate-archive/minatar_sync_curve_pt2

# Re-run of the ddqn_sync1k cells (Freeway + SpaceInvaders @ sync=1000)
# that were lost when the `minatar_sync_curve_resume` sweep's
# tmp/cell{NNN}__{env}__{arm}.parquet S3 paths were overwritten by the
# ddqn_sync3k sub-sweep within the same archive_remote (Bug B —
# tmp paths have no hypothesis namespace, last writer wins).
#
# Workaround until the persistency design is fixed: this YAML defines
# only ONE hypothesis (ddqn_sync1k), so there is no second hypothesis
# in this sweep that could collide. archive_remote and out_dir are
# both fresh paths, so no overwrite of the intact ddqn_sync3k cells
# (which live in `minatar_sync_curve_resume/ddqn_sync3k/` and
# `s3://corroborate-archive/minatar_sync_curve_resume/`) is possible.
#
# Cells to produce: 2 envs × 2 arms × 30 seeds = ~10 cells (Freeway
# chunk_size=15 → 2 chunks × 2 arms; SpaceInvaders chunk_size=10 → 3
# chunks × 2 arms). Wall-clock ~4h serial / ~2h with the prior
# parallelism.

envs:
  - {name: Freeway-MinAtar,        n_seeds: 30, chunk_size: 15}
  - {name: SpaceInvaders-MinAtar,  n_seeds: 30, chunk_size: 10}

base_intervention:
  total_steps: 1000000
  eval_every:  50000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [128]

hypotheses:
  - name: ddqn_sync1k
    predicted_direction: a_gt_b
    intervention:
      sync_period: 1000
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
