name: asterix_si_canonical_verify
out_dir: experiments/data/asterix_si_canonical_verify
env_binding: per_env
archive_remote: s3://corroborate-archive/asterix_si_canonical_verify

# Canonical-verify for Asterix + SpaceInvaders — the remaining
# mystery cohort after MetaMaze cleared.
#
# MinAtar RNG profile (from gymnax source): SI has 0 RNG calls in
# transition (fully deterministic given greedy policy), Asterix has 4
# (modest spawn stochasticity), Breakout 1, Freeway 6. So bumping
# n_episodes doesn't help SI eval-precision and barely helps Asterix.
# The actual variance reducer for low-stochastic envs is more seeds.
#
# Keeping n_episodes=5 (canonical match) and n_seeds=60 (2× canonical).
# Same sha throughout = clean comparison vs the canonical n_seeds=30
# cache; no cross-corpus seed pooling issues. 1M total_steps.
#
# 2 envs × 2 arms × 60 seeds × 1M = 240 cells. chunk_size=10 to fit
# CNN[16]+FC[128] under f32[chunk, capacity=100k, obs_shape] memory.

envs:
  - {name: Asterix-MinAtar, n_seeds: 60, chunk_size: 10}
  - {name: SpaceInvaders-MinAtar, n_seeds: 60, chunk_size: 10}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: "verify_{from_env: name}"
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
