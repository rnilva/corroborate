name: fourrooms_1m
out_dir: experiments/data/fourrooms_1m
arms_shape: paired

envs:
  # 4-int obs vector — MLP, not CNN.
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}

# HPs match expectile_3way's FourRooms cells (the 200k baseline)
# extended to 1M total_steps with 50k eval bursts (20 bursts), to
# match minatar_1M's burst granularity.
base_intervention:
  total_steps: 1000000
  eval_every:  50000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    class: WarmedUpdate
    inner: {class: Adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: vanilla_dqn
    predicted_direction: null

  - name: ddqn
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
