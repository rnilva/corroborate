name: fourrooms_1m
out_dir: experiments/data/fourrooms_1m
env_binding: per_env

envs:
  # 4-int obs vector — MLP, not CNN.
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}

# HPs match expectile_3way's FourRooms cells (the 200k baseline)
# extended to 1M total_steps with 50k eval bursts (20 bursts), to
# match minatar_1M's burst granularity.
defaults:
  total_steps: 1000000
  eval_every:  50000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: vanilla_dqn

  - name: ddqn
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
