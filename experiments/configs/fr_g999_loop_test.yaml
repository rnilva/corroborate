name: fr_g999_loop_test
out_dir: experiments/probes/fr_g999_loop_test
env_binding: shared
archive_remote: s3://corroborate-archive/fr_g999_loop_test
merge_top_level: false

# Tests the "loop hypothesis" at FR γ=0.999 with the newly-registered
# `_FOURROOMS_HASH` (commit 42ead69) and finer per-burst temporal
# resolution (50 bursts × 5 eval episodes vs canonical 10 bursts).
#
# Goal: materialize `policy_churn_late`, `state_hash_entropy_*`,
# `state_repeat_rate_window64_late`, `state_burst_jaccard_*` at FR
# γ=0.999 — these are EMPTY_EXTENT on existing FR corpora because
# pre-fix cells have constant state_hash=0.
#
# If the loop hypothesis transfers from SI γ=0.999 to FR γ=0.999:
#   - state_repeat_rate_window64 should differ by Cohen's d > 1
#     (vanilla loops more than DDQN, just like at SI)
#   - state_repeat_rate_window64 should mediate arm→outcome
#     similarly strongly (≥ 65% shrink expected)
#
# If the loop hypothesis is SI-specific (e.g., MinAtar coarse hash
# is what makes it work):
#   - FR with finer state_hash (cardinality 28561 vs SI's 512)
#     might NOT show the same loop signal
#   - mediation strength would be weaker
#
# This is the cross-env corroboration step. SI-only would be a thin
# result.
#
# Canonical FR γ=0.999 × MLP × unshaped × B=32 × 1M scope.
# Cells: 30 seeds × 2 arms = 60 cells. ~30-60 min on a single GPU.

envs:
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 1000000
  eval_every:  20000        # 50 eval bursts over 1M steps (vs canonical 10)
  n_episodes:  5
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 10000

interventions:
  - name: ddqn_vs_vanilla
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
