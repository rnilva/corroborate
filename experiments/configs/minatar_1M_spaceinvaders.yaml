name: minatar_1M_spaceinvaders
out_dir: experiments/data/minatar_1M_spaceinvaders
env_binding: per_env
archive_remote: s3://corroborate-archive/minatar_1M_spaceinvaders

# SpaceInvaders × {vanilla, ddqn} at 1M steps. Companion to
# `minatar_1M.yaml`; the bucket is intentionally distinct so the
# cross-sweep `archive_remote` lint stays green and the cell
# fingerprints don't co-mingle on cloud.

envs:
  - {name: SpaceInvaders-MinAtar, n_seeds: 30, chunk_size: 15}

defaults:
  total_steps: 1000000
  eval_every:  50000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: vanilla_dqn

  - name: ddqn
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
