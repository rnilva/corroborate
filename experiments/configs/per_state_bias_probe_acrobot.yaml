name: per_state_bias_probe_acrobot
out_dir: experiments/data/per_state_bias_probe_acrobot
env_binding: shared

# Per-state cumulative-bias probe sweep on Acrobot γ=0.999
# (CLAIM 10 regime — link causally HELD via DoWhy).
# 1 env × 2 arms × 30 seeds = 60 cells.

envs:
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: ddqn_vs_vanilla_acrobot_g0999
    base:
      gamma: 0.999
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
