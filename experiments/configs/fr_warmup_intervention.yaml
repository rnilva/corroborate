name: fr_warmup_intervention
out_dir: experiments/probes/fr_warmup_intervention
env_binding: shared
archive_remote: s3://corroborate-archive/fr_warmup_intervention

# Anchor-failure causal-intervention test at FR × MLP × unshaped × γ=0.999.
#
# Tests whether `warmed_update.warmup_steps` (which zeros parameter
# updates during the first N training steps — see
# `claims/optimizer.py:warmed_update`'s step-function schedule) lets
# ε-greedy find the goal during the no-training phase. If the goal
# is found during warmup, replay carries reward signal when training
# begins → Q learns properly from grounded data.
#
# Predictions:
# - warmup_100 (current default): vanilla outcome ≈ 0.19 (Q-explosion).
# - warmup_10k: many seeds find the goal during warmup. Vanilla outcome
#   jumps substantially.
# - warmup_100k: most seeds find goal during warmup. Vanilla outcome
#   approaches the γ=0.99 ceiling (≈ 1.0).
# - DDQN's benefit on outcome should SHRINK as warmup grows.
#
# Tests via bridges in `jens_reduction_factors.py`:
# - `vanilla_outcome_recovers_with_warmup_at_fr_g999_mlp`
# - `vanilla_jens_shrinks_with_warmup_at_fr_g999_mlp`
# Composed into `finding_warmup_rescues_vanilla`.
#
# YAML schema: per-intervention `base:` is a shallow merge over
# `defaults:`. Nested config (e.g., optimizer subtree) must be
# supplied IN FULL per intervention — there's no dotted-path-key
# deep-override. Each intervention re-declares the whole
# `optimizer:` block with the warmup_steps it wants.

envs:
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 1000000
  eval_every:  100000
  n_episodes:  5
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: warmup_100
    base:
      optimizer:
        fn: warmed_update
        inner: {fn: adam, lr: 0.0001}
        warmup_steps: 100
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: warmup_10k
    base:
      optimizer:
        fn: warmed_update
        inner: {fn: adam, lr: 0.0001}
        warmup_steps: 10000
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: warmup_100k
    base:
      optimizer:
        fn: warmed_update
        inner: {fn: adam, lr: 0.0001}
        warmup_steps: 100000
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
