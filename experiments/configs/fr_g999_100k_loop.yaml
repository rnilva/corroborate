name: fr_g999_100k_loop
out_dir: experiments/probes/fr_g999_100k_loop
env_binding: shared
archive_remote: s3://corroborate-archive/fr_g999_100k_loop
merge_top_level: false

# FR γ=0.999 at 100k total_steps — pre-saturation window for the
# loop-mediation hypothesis at FR.
#
# Why 100k:
# - At 1M, DDQN outcome saturates at 1.0 (best-burst-raw-mean) and
#   the within-DDQN variance vanishes → PC/partial-Spearman can't
#   fire on the dominant mediator question.
# - Per-burst trace inspection (findings_fr_g999_per_burst_trajectory)
#   showed DDQN MC reaches the median crossover-to-0.95 around
#   burst 12 (=240k steps); cells span burst 4-23 = 80k-460k.
# - At 100k: DDQN is mid-transition (~7% of cells crossed), vanilla
#   still building Q toward Lemma 2 asymptote. Within-arm variance
#   high in both arms → mediation analysis can fire cleanly.
#
# Otherwise matches `fr_g999_loop_test.yaml` HPs exactly except for
# total_steps (so 1M and 100k corpora are config-controlled):
#   MLP[64,64], γ=0.999, sync_period 100, replay cap 50k batch 32,
#   adam lr 1e-4 warmup 100, ε 1.0→0.05 over 10k, n_eval_episodes 5.
#
# eval_every=2000 → 50 eval bursts × 5 episodes (matching the
# 1M sweep's burst count for trajectory-shape comparability).
# Tighter temporal grid resolves the early transition that the
# 1M sweep skips over in its first 5 bursts.
#
# Cells: 30 seeds × 2 arms = 60 cells. ~5-10 min on CPU, ~2-5
# min on GPU.

envs:
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 100000
  eval_every:  2000
  n_episodes:  5
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 10000

interventions:
  - name: ddqn_vs_vanilla
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
