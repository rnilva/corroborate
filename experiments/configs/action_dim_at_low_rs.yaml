name: action_dim_at_low_rs
out_dir: experiments/data/action_dim_at_low_rs
arms_shape: chunked
archive_remote: s3://corroborate-archive/action_dim_at_low_rs

# Pearl-rung-2 test of the Hasselt-floor √(log|A|) factor.
#
# At the rescue-regime reward scale (rs=0.1) on sparse-reward
# envs, the do-effect mean_diff(ddqn − vanilla) in native units
# should scale with √(log|A|), per ε = σ_Q · √(2 log|A|).
# Larger |A| → larger Jensen bias for vanilla → bigger gap for
# DDQN to fill → bigger interventional contrast.
#
# 4 sparse-reward envs spanning |A| ∈ {2, 4, 5, 10}, 2 reward
# scales (rs=0.1 = rescue, rs=1.0 = control), 2 arms, 30 seeds.
# Total: 4 × 2 × 2 × 30 = 480 cells.
#
# Prediction (normalized to FourRooms-baseline gap):
#   DeepSea (|A|=2):          √(log 2 / log 4) = 0.71  → gap ≈ 0.34
#   FourRooms (|A|=4):        baseline 1.00            → gap ≈ 0.49
#   DiscountingChain (|A|=5): √(log 5 / log 4) = 1.07  → gap ≈ 0.52
#   MNISTBandit (|A|=10):     √(log 10 / log 4) = 1.40 → gap ≈ 0.69
# (MNISTBandit isn't sparse-reward so vanilla may not fail —
#  serves as a NULL test if rescue depends on sparse reward.)
envs:
  - {name: DeepSea-bsuite,          n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 0.1}]}
  - {name: DeepSea-bsuite,          n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 1.0}]}
  - {name: FourRooms-misc,          n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 0.1}]}
  - {name: FourRooms-misc,          n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 1.0}]}
  - {name: DiscountingChain-bsuite, n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 0.1}]}
  - {name: DiscountingChain-bsuite, n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 1.0}]}
  - {name: MNISTBandit-bsuite,      n_seeds: 30, chunk_size: 10, wrappers: [{type: reward_scale, scale: 0.1}]}
  - {name: MNISTBandit-bsuite,      n_seeds: 30, chunk_size: 10, wrappers: [{type: reward_scale, scale: 1.0}]}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: vanilla_dqn
    predicted_direction: null
    intervention: {}

  - name: ddqn
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
