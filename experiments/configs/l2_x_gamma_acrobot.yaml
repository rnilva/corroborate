name: l2_x_gamma_acrobot
out_dir: experiments/data/l2_x_gamma_acrobot
arms_shape: chunked
archive_remote: s3://corroborate-archive/l2_x_gamma_acrobot

# Probe the "Goldilocks ceiling" finding from `gamma_sweep_acrobot_high`:
# at γ=0.999, vanilla regressed from −53 (γ=0.99) to −73, training
# destabilized before the chain-depth amplifier could activate.
#
# Hypothesis: γ acts as a dual lever — (1) effective horizon, the
# mechanism we want to study, and (2) implicit regularizer (Q targets
# bounded by R_max/(1−γ)). High γ removes the regularization, exposing
# Q-explosion. Adding explicit L2 weight decay should restore stability
# and let chain-depth-amplifier run further.
#
# 6 cells (3 (γ, wd) configs × 2 arms) × 30 seeds × 200k = 6 arms.
# CPU runtime ~5 min/arm × 6 = ~30 min.
#
# Reference cells already exist in `gamma_sweep_acrobot_high`:
#   γ=0.999, wd=0   vanilla_dqn_g0999, ddqn_g0999  ← regresses
# This sweep adds the wd > 0 cells to falsify or corroborate the
# regularization-confound hypothesis.

envs:
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 30}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    class: WarmedUpdate
    inner: {class: Adam, lr: 0.0001, weight_decay: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  # γ=0.99 × wd=1e-4 — sanity check (L2 shouldn't break things at
  # the working baseline γ).
  - name: vanilla_g099_wd1em4
    predicted_direction: null
    intervention:
      gamma: 0.99
  - name: ddqn_g099_wd1em4
    predicted_direction: a_gt_b
    intervention:
      gamma: 0.99
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}

  # γ=0.999 × wd=1e-4 — primary test cell. If vanilla recovers from
  # −73 to ≥ −60 here, the Goldilocks ceiling was a regularization
  # artifact. If still ~−73, the ceiling is intrinsic.
  - name: vanilla_g0999_wd1em4
    predicted_direction: null
  - name: ddqn_g0999_wd1em4
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}

  # γ=0.999 × wd=1e-3 — stronger L2 if 1e-4 is insufficient.
  - name: vanilla_g0999_wd1em3
    predicted_direction: null
    intervention:
      optimizer:
        class: WarmedUpdate
        inner: {class: Adam, lr: 0.0001, weight_decay: 0.001}
        warmup_steps: 100
  - name: ddqn_g0999_wd1em3
    predicted_direction: a_gt_b
    intervention:
      optimizer:
        class: WarmedUpdate
        inner: {class: Adam, lr: 0.0001, weight_decay: 0.001}
        warmup_steps: 100
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
