name: asterix_g0999_action_dup_k2_ckpt
out_dir: experiments/data/asterix_g0999_action_dup_k2_ckpt
env_binding: shared
archive_remote: s3://corroborate-archive/asterix_g0999_action_dup_k2_ckpt

# Asterix γ=0.999 with ActionDuplicate(k=2) — modest inflation of
# declared |A| from 5 to 10. Env physics, reward signal, and
# optimal Q* unchanged (Theorem 1 of ActionDuplicate's docstring);
# only the Q-net's labeling task and the Hasselt-floor magnitude
# change.
#
# Counterfactual probe for the action-space-complexity / Hasselt-
# floor component of the proposed Asterix γ=0.999 outlier.
#
# Two opposing predictions:
#   (A) Sharpness/anisotropy load-bearing: k=2 spreads argmax mass
#       across ~2 equivalent labels → policy "softer" → harm
#       reduces. Predict: d(D vs V) shifts from canonical −1.45
#       toward 0.
#   (B) Hasselt-floor magnitude load-bearing: k=2 inflates √(2 log
#       |A|) by ~20% → V's Q-overestimation grows → bg-wedge
#       larger → harm grows. Predict: d more negative than −1.45.
#
# Discriminator across (A) vs (B):
#   - d less negative than −1: condition (3) [sharpness] is
#     load-bearing; deadly-triad framing holds at the sharpness axis.
#   - d more negative than −1.5: Hasselt-floor magnitude is
#     load-bearing; refines the triad story.
#   - d ≈ −1.45 unchanged: action-space-complexity is not
#     a load-bearing axis at Asterix γ=0.999.
#
# Prior context: `findings_action_dup_mismatch_falsified` showed
# FR γ=0.999 has Δ_out drop from +0.748 (k=1) to +0.108 (k=4) —
# k DECREASES DDQN benefit at high γ on FR. Asterix γ=0.999 is
# in the OPPOSITE polarity regime (DDQN harms at k=1); this test
# tells us whether the same k-direction applies or reverses.
#
# Same canonical HPs as asterix_g0999_canonical_n_eps20_ckpt: 1M
# steps, n_episodes=20, sync=1000, lr=1e-4 + warmup, ε anneal 100k.
# Q checkpoints kept for downstream per-burst analyses.
#
# Cells: 1 intervention × 2 arms × 15 seeds = 30 cells.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true

envs:
  - {name: Asterix-MinAtar, n_seeds: 15, chunk_size: 15,
     wrappers: [{type: action_duplicate, k: 2}]}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.999
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: action_dup_k2
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
