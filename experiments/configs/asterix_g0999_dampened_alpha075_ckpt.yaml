name: asterix_g0999_dampened_alpha075_ckpt
out_dir: experiments/data/asterix_g0999_dampened_alpha075_ckpt
env_binding: shared
archive_remote: s3://corroborate-archive/asterix_g0999_dampened_alpha075_ckpt

# Companion to `asterix_g0999_dampened_alpha_ckpt` — fills the
# α=0.75 dose-response point (closer to DDQN). HPs match
# `asterix_g0999_canonical_n_eps20_ckpt` exactly so cells join
# the 4-point panel: α ∈ {0, 0.25, 0.5, 0.75, 1.0} × 15 seeds.
#
# Cells: 1 intervention × 1 arm × 1 chunk of 15 seeds = 1 cell.
# Wall: ~75 min on GPU.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true
keep_q_per_action: true

envs:
  - {name: Asterix-MinAtar, n_seeds: 15, chunk_size: 15}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.999
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: dampened_alpha_075
    base: {}
    arms:
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.75}
