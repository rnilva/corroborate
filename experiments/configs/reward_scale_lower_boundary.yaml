name: reward_scale_lower_boundary
out_dir: experiments/data/reward_scale_lower_boundary
arms_shape: chunked
archive_remote: s3://corroborate-archive/reward_scale_lower_boundary

# Map the lower boundary of the rescue regime on FourRooms
# precisely. The earlier `reward_scale_low_fourrooms` mapped
# rs ∈ {0.01, 0.03, 0.1, 0.3, 1.0} and showed:
#   rs=0.01 → DDQN advantage +0.087 (rescue collapsing)
#   rs=0.03 → +0.245 (rescue fully active)
#
# This sweep extends below 0.01 to find where DDQN itself
# also fails (gradient-starvation regime). At rs=0.001 we
# expect both arms near zero policy quality. At rs=0.01 we
# expect DDQN partial.
#
# 4 scales × 2 arms × 30 seeds at 200k steps = 240 cells.
# FourRooms is 16-state, 64×64 MLP, fast on CPU. ETA ~60 min
# on CPU (parallel to a separate GPU sweep).
envs:
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 0.001}]}
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 0.003}]}
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 0.01}]}
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30, wrappers: [{type: reward_scale, scale: 0.03}]}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: vanilla_dqn
    predicted_direction: null
    intervention: {}

  - name: ddqn
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
