name: cartpole_dense_eval
out_dir: experiments/data/cartpole_dense_eval
env_binding: shared

# Catch the pre-saturation transient on CartPole. At canonical
# eval_every=100000 (1M), 82% of burst-0 episodes already hit the
# 500-step cap (memory `findings_substrate_realization_variance`
# audit); the transient is invisible at canonical eval grain.
#
# eval_every=2500 over 100k total_steps → 40 bursts, catches the
# pre-saturation learning curve. CartPole MLP[64,64] on CPU is
# fast (~1-2 min/cell). n=30 seeds × 2 arms × 1 wrap = 2 cells,
# chunk_size=30 → single chunk per arm.

envs:
  - {name: CartPole-v1, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 100000
  eval_every:  2500
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: ddqn_vs_vanilla
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
