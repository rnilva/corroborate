name: mountaincar_exploration_sweep
out_dir: experiments/data/mountaincar_exploration_sweep
env_binding: per_env
archive_remote: s3://corroborate-archive/mountaincar_exploration_sweep

# MountainCar is exploration-bound — needs to swing left/right to build
# momentum. At default ε_final=0.05 anneal=10k, vanilla/DDQN both stuck
# around -78 to -85 (threshold = -67.3, neither solves).
#
# Test 3 exploration variants × 2 arms (vanilla, DDQN). Predict: high-ε
# regimes should solve; DDQN's bias correction might or might not help
# above baseline depending on whether exploration breaks the impasse.
#
# 3 conditions × 2 arms × 30 seeds × 200k steps. Vector obs MLP, fast on CPU.

envs:
  - {name: MountainCar-v0, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  # eps_final=0.1, slower anneal — moderately more exploration
  - name: vanilla_eps0p1_slow
    base:
      action_select:
        fn: epsilon_greedy
        schedule: {fn: linear_epsilon, eps_init: 1.0, eps_final: 0.1, anneal_steps: 50000}
  - name: ddqn_eps0p1_slow
    base:
      action_select:
        fn: epsilon_greedy
        schedule: {fn: linear_epsilon, eps_init: 1.0, eps_final: 0.1, anneal_steps: 50000}
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}

  # eps_final=0.2, default anneal — high constant exploration floor
  - name: vanilla_eps0p2_fast
    base:
      action_select:
        fn: epsilon_greedy
        schedule: {fn: linear_epsilon, eps_init: 1.0, eps_final: 0.2, anneal_steps: 10000}
  - name: ddqn_eps0p2_fast
    base:
      action_select:
        fn: epsilon_greedy
        schedule: {fn: linear_epsilon, eps_init: 1.0, eps_final: 0.2, anneal_steps: 10000}
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}

  # eps_final=0.3, slow anneal — aggressive sustained exploration
  - name: vanilla_eps0p3_slow
    base:
      action_select:
        fn: epsilon_greedy
        schedule: {fn: linear_epsilon, eps_init: 1.0, eps_final: 0.3, anneal_steps: 50000}
  - name: ddqn_eps0p3_slow
    base:
      action_select:
        fn: epsilon_greedy
        schedule: {fn: linear_epsilon, eps_init: 1.0, eps_final: 0.3, anneal_steps: 50000}
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
