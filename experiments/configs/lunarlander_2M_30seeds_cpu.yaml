name: lunarlander_2M_30seeds_cpu
out_dir: experiments/data/lunarlander_2M_30seeds_cpu
env_binding: per_env
archive_remote: s3://corroborate-archive/lunarlander_2M_30seeds_cpu

# LunarLander-v2-jax × γ ∈ {0.99, 0.999}, extended to 2M total_steps
# on CPU. Same tuned-canonical HPs as lunarlander_tuned_sync1000_gpu
# (sync=1000, lr=1e-4, batch=32, hidden=[64,64], eps_anneal=100k).
#
# 1M earlier showed both arms with similar mean outcomes and wide
# IQR — possibly under-trained. 2M tests whether DDQN's outcome
# advantage emerges (or doesn't) when both arms have more time
# to converge.
#
# 2 γ × 2 arms × 30 seeds = 120 cells. chunk_size=10 for parallel
# CPU execution.

envs:
  - {name: LunarLander-v2-jax, n_seeds: 30, chunk_size: 10}

defaults:
  total_steps: 2000000
  eval_every:  40000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000

interventions:
  - name: g099
    base: {gamma: 0.99}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: g0999
    base: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
