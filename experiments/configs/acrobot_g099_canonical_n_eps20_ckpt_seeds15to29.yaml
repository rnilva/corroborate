name: acrobot_g099_canonical_n_eps20_ckpt_seeds15to29
out_dir: experiments/data/acrobot_g099_canonical_n_eps20_ckpt_seeds15to29
env_binding: shared
archive_remote: s3://corroborate-archive/acrobot_g099_canonical_n_eps20_ckpt_seeds15to29

# Acrobot γ=0.99 with FULL Q traces + per-burst Q checkpoints.
#
# Matches the canonical MLP-env scope (sync=100, capacity=50000,
# hidden=(64,64), 1M steps) from `experiments.findings.ddqn._scope`,
# with high-eval-resolution n_episodes=20 and `keep_q_per_action=true`
# so `predicted_q_per_step`, `online_max_q_per_step`, etc. are recorded.
# Enables REDQ-style relative-bias mediation computed from raw traces
# (mean Q over ALL visited eval (s,a)).
#
# Cells: 1 intervention × 2 arms × 1 chunk of 15 seeds = 2 batched cells.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true
keep_q_per_action: true

envs:
  - {name: Acrobot-v1, n_seeds: 15, chunk_size: 15, seed_offset: 15}

defaults:
  total_steps: 100000
  eval_every:  2000
  n_episodes:  20
  gamma:       0.99
  sync_period: 100
  n_step:      1
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: canonical_g099_n_eps20
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
