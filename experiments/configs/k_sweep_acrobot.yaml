name: k_sweep_acrobot
out_dir: experiments/data/k_sweep_acrobot
arms_shape: chunked

# action-duplicate (k) sweep on Acrobot — bias-channel target.
# Pre-registered hypothesis per Hasselt 2010: max-overestimation
# floor ε ≤ σ_Q · √(2 log|A|). Scaling |A| via k inflates the
# Hasselt floor → larger jens → DDQN's bias-correction should
# scale with √(log K). If DDQN's outcome benefit on Acrobot
# scales similarly, the bias-channel mediation (memory
# `findings_ddqn_mediator_heterogeneity`, 51% jens absorption) is
# causally verified via active intervention.
#
# k ∈ {1, 4, 16} ⇒ |A| ∈ {3, 12, 48} ⇒ √(log|A|) ∈ {1.05, 1.58, 1.97}.
# Predicted d_jens ratio (k=16/k=1) ≈ 1.88×; predicted d_out
# ratio similar IF bias is load-bearing.
#
# 3 k × 1 env × 2 arms × 30 seeds × 1M = 180 cells.
envs:
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 1}]}
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 4}]}
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 16}]}

base_intervention:
  total_steps: 1000000
  eval_every:  100000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: ddqn_vs_vanilla
    predicted_direction: a_gt_b
    intervention: {}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
