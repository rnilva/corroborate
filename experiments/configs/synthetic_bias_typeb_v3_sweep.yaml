name: synthetic_bias_typeb_v3_pilot
out_dir: experiments/data/synthetic_bias_typeb_v3_pilot
env_binding: per_env
archive_remote: s3://corroborate-archive/synthetic_bias_typeb_v3_pilot

# v3 synthetic bias Type-A/B controlled-substrate sweep.
#
# v1 → v2 → v3 evolution lives in:
# - docs/PRE_REGISTRATION_synthetic_bias_typeb.md
# - /tmp/synthetic_env_roast.md  (v1 critique)
# - /tmp/synthetic_v2_roast.md   (v2 critique)
#
# v1 was scrapped (action-independent transitions). v2 was scrapped
# (per-step reward-noise knob conflated with Q-target-side
# Var_a[V*(s')]; |Q*| 50× under natural-env scale; n_seeds=12
# under-powered; L=64 hidden=[32,32] was 12.8× over-parameterized
# → no FA-binding regime; walk-back paths pre-laundered every
# observed-data shape).
#
# v3 places the anisotropy primitive on the Q-TARGET side:
# state-baked payoffs `mu_state(s) = peak_value · β^(s mod K)`
# with peak_value=1.0 → |Q*| at γ=0.999 ≈ 1000 (natural-env
# Asterix scale), noise_sigma=0.02 → σ/Δ ≈ 2% (Asterix knife-edge
# regime), L=1024 with hidden=[16] → genuine FA-binding (aliases
# 4096 Q-values into 16-dim hidden).
#
# Panel: 6 envs × 3 γ × 2 arms × 27 seeds = 972 cells (≤ 1000
# budget). CPU budget: ≤ 4h at the chain-MDP scale (the L=1024
# corner is slower per-step because of the wider one-hot vector
# but bounded by replay-batch matmul cost; ~3-4 wall-clock h on
# a 16-core box).
#
# Pre-registered bridges — sweep-launch commitments captured in
# `<out_dir>/pre_registration.json`. Each entry locks the bridge's
# source-hash, predicted direction, and predicted verdict at the
# git HEAD as of sweep launch. Post-sweep `corroborate audit
# pre-registration <corpus>` re-resolves each bridge against the
# corpus and reports source-hash drift OR verdict drift.
#
# These commitments encode the substantive predictions from
# `docs/PRE_REGISTRATION_synthetic_bias_typeb.md`:
#   P1 (PRIMARY): ρ(β, d_out) ≤ −0.5 pooled (n_strata=18)
#   D1 (DIAGNOSTIC): ρ(argmax_margin, d_out) ≥ +0.5 (n_strata=18)
#   D2 (DIAGNOSTIC): ρ(β, d_out) ≤ −0.6 at γ=0.999 (n_strata=6;
#       structural POWER_INSUFFICIENT — diagnostic only)
#   N1: |ρ(L, d_out)| < 0.30 AND p > 0.30 at β=0 (n_strata=6)
pre_registered_bridges:
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.ddqn_harms_under_high_beta__synthetic_typeb_v3
    predicted_direction: a_lt_b
    predicted_verdict: held
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.ddqn_helps_when_argmax_margin_wide__synthetic_typeb_v3
    predicted_direction: a_gt_b
    predicted_verdict: held
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.ddqn_harm_amplified_at_g999__synthetic_typeb_v3
    predicted_direction: a_lt_b
    predicted_verdict: held
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.n_states_alone_does_not_drive_dout__synthetic_typeb_v3
    predicted_direction: 'null'
    predicted_verdict: held

# 6 v3 envs: 2 n_states × 3 beta levels.
envs:
  - {name: TypeBChainV3-K4-L32-beta0.0-synthetic, n_seeds: 27, chunk_size: 9}
  - {name: TypeBChainV3-K4-L32-beta0.5-synthetic, n_seeds: 27, chunk_size: 9}
  - {name: TypeBChainV3-K4-L32-beta0.9-synthetic, n_seeds: 27, chunk_size: 9}
  - {name: TypeBChainV3-K4-L1024-beta0.0-synthetic, n_seeds: 27, chunk_size: 9}
  - {name: TypeBChainV3-K4-L1024-beta0.5-synthetic, n_seeds: 27, chunk_size: 9}
  - {name: TypeBChainV3-K4-L1024-beta0.9-synthetic, n_seeds: 27, chunk_size: 9}

defaults:
  # 200k steps to give the L=1024 FA-binding corner adequate
  # convergence time. At L=32, 200k steps × batch=32 gives ~6.4M
  # training tuples → each (s,a) sees ~50k updates (well-converged).
  # At L=1024, ~1.5k updates per (s,a) — Q is partially-learned,
  # which is the FA-binding regime the v3 design tests.
  total_steps: 200000
  eval_every:  10000
  n_episodes:  10
  gamma:       0.99
  sync_period: 500
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0003}
    warmup_steps: 200
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 80000
  q_network:
    class: MLP
    # Single hidden layer of 16 units (critic rec #3: hidden ≤ 16).
    # At L=32 the MLP must represent K·L=128 Q-values through 16
    # hidden units (~8 Q-values per hidden unit — mild compression).
    # At L=1024 it must represent K·L=4096 Q-values through 16
    # hidden units (256 Q-values per unit) — genuine FA-binding
    # regime where Hasselt max-of-K bias becomes load-bearing.
    hidden: [16]

# γ × DDQN-vs-vanilla cross. Each γ level has 2 arms (vanilla
# baseline + DDQN treatment); the YAML expands to 3 γ × 2 arms ×
# 6 envs × 27 seeds = 972 cells via env_binding=per_env.
interventions:
  - name: "g095_{from_env: name}"
    base: {gamma: 0.95}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: "g099_{from_env: name}"
    base: {gamma: 0.99}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: "g0999_{from_env: name}"
    base: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
