name: survive_sync_intermediate_cartpole
out_dir: experiments/data/survive_sync_intermediate_cartpole
arms_shape: chunked

# CartPole companion to survive_sync_intermediate_minatar — uses MLP
# instead of CNN. Same purpose: populate more strict-mech-HELD
# configs in CLAIM 17 scope on SURVIVE-class envs to corroborate
# CLAIM 20 (argmax_entropy_late_van predicts SURVIVE link power).
#
# 1 env × 3 sync × 2 arms × 30 seeds = 180 cells.
envs:
  - {name: CartPole-v1, n_seeds: 30, chunk_size: 30}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: vanilla_dqn_sync500
    predicted_direction: null
    intervention: {sync_period: 500}
  - name: ddqn_sync500
    predicted_direction: a_gt_b
    intervention:
      sync_period: 500
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
  - name: vanilla_dqn_sync1500
    predicted_direction: null
    intervention: {sync_period: 1500}
  - name: ddqn_sync1500
    predicted_direction: a_gt_b
    intervention:
      sync_period: 1500
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
  - name: vanilla_dqn_sync3000
    predicted_direction: null
    intervention: {sync_period: 3000}
  - name: ddqn_sync3000
    predicted_direction: a_gt_b
    intervention:
      sync_period: 3000
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
