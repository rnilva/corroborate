name: asterix_g0999_init_v_burst25_continue_ddqn
out_dir: experiments/data/asterix_g0999_init_v_burst25_continue_ddqn
env_binding: shared
archive_remote: s3://corroborate-archive/asterix_g0999_init_v_burst25_continue_ddqn

# Init-from-Q-checkpoint sweep: load V's mid-training (burst=25,
# step 500k) Q-net weights per seed and continue training under
# DDQN's clip vs vanilla. Tests whether DDQN's harm at γ=0.999
# Asterix comes from EARLY learning dynamics (the chain-amplification
# damping happens before step 500k → V's already-locked-in attractor
# bounds the harm) or from STEADY-STATE operator semantics (DDQN's
# clip pulls a V-converged attractor toward D's attractor and harm
# emerges DURING the continuation).
#
# Predictions across the two hypotheses:
#
# - **Early-dynamics hypothesis**: arm `continue_ddqn` ≈ V's
#   1M canonical eval (no D-harm because the V attractor is
#   already in place; DDQN's clip damps Q-magnitude but doesn't
#   relocate the attractor).
# - **Steady-state hypothesis**: arm `continue_ddqn` drifts toward
#   D's 1M canonical eval (D's clip pulls the policy toward a
#   different attractor at any starting point).
#
# Three arms (single sweep, two arms here + cross-corpus
# comparison against the canonical from-scratch sweep for the
# third):
#
# 1. **continue_ddqn**: init from V burst25, continue 1M with DDQN.
#    The experimental arm — the test of WHICH hypothesis holds.
# 2. **continue_v**: init from V burst25, continue 1M with V.
#    Within-sweep control — should match V's canonical eval
#    after 1M more steps (V trained for total 1.5M of weight
#    updates across the two sweeps; if the continuation is
#    well-defined, eval converges to V's steady state on
#    Asterix γ=0.999 regardless).
# 3. **canonical from scratch** (NOT in this sweep): the existing
#    `experiments/data/asterix_g0999_canonical_n_eps20_ckpt` corpus
#    is the from-scratch baseline. Its arm canonical_n_eps20 with
#    DDQN gives the canonical D harm signal; comparing arm 1 (this
#    sweep) against it tests the load-time-vs-from-scratch divergence.
#
# Init-checkpoint family:
#   experiments/data/asterix_g0999_canonical_n_eps20_ckpt/
#     q_checkpoints/canonical_n_eps20/cell000_<seed>_burst25.msgpack
# 15 seeds (0..14), burst=25 = step 500_000.
#
# Total cells: 1 intervention × 2 arms × 1 chunk of 15 seeds = 2.
# Storage: 15 seeds × 51 bursts × 2 arms × ~1.6MB ≈ 2.5GB Q ckpts
# (same scale as the canonical sweep).
# Wall: ~65-75 min per cell × 2 cells ≈ 2.5h on GPU.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true

# Per-seed online-params pytree loaded from this template before
# the cell's vmap. `{seed}` is the canonical placeholder; each
# seed in the chunk (0..14) consumes its matching burst25 ckpt.
# The msgpack carries online + target params; this sweep uses
# load_target=False (the default) — only online is threaded into
# `init_override.online_params` and target_params is then mirrored
# from online via `init_state` (matches the from-scratch path).
#
# A sibling sweep that asks the steady-state-operator question
# (does DDQN's clip relocate a paired (online, target) attractor?)
# would set `init_q_checkpoint_load_target: true` here so both
# msgpack fields land in the InitOverride — preserving the
# τ-step staleness DDQN's bias-reduction premise depends on.
init_q_checkpoint_path_template: experiments/data/asterix_g0999_canonical_n_eps20_ckpt/q_checkpoints/canonical_n_eps20/cell000_{seed}_burst25.msgpack

envs:
  - {name: Asterix-MinAtar, n_seeds: 15, chunk_size: 15}

defaults:
  total_steps: 1000000           # 1M from the loaded init state
  eval_every:  20000
  n_episodes:  20                # matches canonical_n_eps20 for clean cross-sweep eval
  gamma:       0.999
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  # ε-schedule: hold at the post-anneal value (0.05). The original
  # canonical_n_eps20 sweep annealed 1.0→0.05 over the first 100k
  # steps; at burst=25 (step 500k) the schedule had been at 0.05
  # for 400k steps. Setting eps_init = eps_final = 0.05 keeps the
  # continuation at the same exploration regime the init-ckpt
  # was trained under (matters for state-coverage analyses —
  # cf. findings_canonical_asterix_exploration_hypothesis_confirmed).
  # anneal_steps > 0 required by the schedule's assertion; the
  # value doesn't matter since the line is flat.
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 0.05
      eps_final: 0.05
      anneal_steps: 1
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: init_v_burst25
    base: {}
    arms:
      # Arm 0: continue under V (control) — empty intervention,
      # `base` configuration applied as-is. Each seed's
      # `init_online_params` flows in via the sweep-level template;
      # the only difference from arm 1 is the bootstrap slot.
      - []
      # Arm 1: continue under DDQN (experimental). Swap the
      # bootstrap's greedification to double_greedify — the
      # canonical DDQN intervention.
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
