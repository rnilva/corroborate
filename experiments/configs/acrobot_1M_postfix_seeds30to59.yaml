name: acrobot_1M_postfix_seeds30to59
out_dir: experiments/data/acrobot_1M_postfix_seeds30to59
arms_shape: paired

# Extends acrobot_1M_postfix with 30 more seeds (30..59) using the
# new EnvConfig.seed_offset field. Pairs with the existing 0..29
# seeds for a 60-seed Acrobot panel — verifying the OLD vs NEW
# panel-level differences are within sampling noise.
envs:
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 15, seed_offset: 30}

base_intervention:
  total_steps: 1000000
  eval_every:  100000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: ddqn_vs_vanilla
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
