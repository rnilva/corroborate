name: asterix_g0999_dampened_alpha_ckpt
out_dir: experiments/data/asterix_g0999_dampened_alpha_ckpt
env_binding: shared
archive_remote: s3://corroborate-archive/asterix_g0999_dampened_alpha_ckpt

# Convex-interpolated DDQN-vanilla dose-response at Asterix γ=0.999.
# Tests the bootstrap-gap (bg-mismatch) wedge-mediator hypothesis: if
# the wedge `w_t := max_a Q_target(s', a) − Q_target(s', argmax_a
# Q_online(s', a))` is causally load-bearing for the d_eval ≈ -0.8
# to -1.45 harm, then dose-response on α (the wedge's per-step
# weighting) should be MONOTONIC.
#
# bootstrap target:
#   target(α) = r + γ · [(1-α) · max_a Q_target(s', a)
#                        + α · Q_target(s', argmax_a Q_online(s', a))]
#
# α=0  → vanilla   (already in canonical_n_eps20_ckpt as V arm)
# α=1  → DDQN      (already in canonical_n_eps20_ckpt as D arm)
# α=0.25, 0.5 → new (this sweep)
# (α=0.75 deferred — if dose-response is roughly linear at 0.25/0.5,
# 0.75 is implied; if non-monotone, 0.75 is the kicker test)
#
# Pre-reg verdict shapes:
#   - Monotonic linear decrease in d_eval(α=x) vs α=0 baseline →
#     bg-mismatch wedge is THE causal mediator (PR-1)
#   - Sub-linear saturation → bg-mismatch is ONE of multiple channels
#   - Non-monotone (U-shape) → wedge interaction with another factor;
#     refute simple mediator claim
#   - Flat (α-invariant eval) → bg-mismatch is downstream marker
#     (REFUTES 5-panel correlational mediation)
#
# HPs match `asterix_g0999_canonical_n_eps20_ckpt` exactly so the
# existing 15 V cells (α=0) and 15 D cells (α=1) join cleanly into
# the dose-response panel (4 α-values × 15 seeds = 60 cells total
# across this corpus + canonical_n_eps20_ckpt).
#
# Cells: 1 intervention × 2 arms × 1 chunk of 15 seeds = 2 batched
# cells. Wall: ~2.5h on GPU.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true
keep_q_per_action: true

envs:
  - {name: Asterix-MinAtar, n_seeds: 15, chunk_size: 15}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.999
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: dampened_alpha
    base: {}
    arms:
      # arm 0: α=0.25 (closer to vanilla; 25% of DDQN wedge weight)
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.25}
      # arm 1: α=0.50 (halfway; 50% of DDQN wedge weight)
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.5}
