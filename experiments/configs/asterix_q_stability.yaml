name: asterix_q_stability
out_dir: experiments/data/asterix_q_stability
arms_shape: paired
# Probe whether Q-explosion on Asterix masks the bias→outcome link.
#
# Baseline (sync=100, wd=0) gives Q_late ≈ 5×10⁶ and DDQN slightly
# hurts (Δ=-0.05, p=0.07 marginal). Two stabilization mechanisms:
#   - Slow target sync (Mnih 2015 default 10000 vs our 100) decouples
#     bootstrap target from online net, kills divergence by reducing
#     positive-feedback rate
#   - Weight decay (AdamW path) regularizes the net to small weights,
#     bounds Q magnitude implicitly
#
# 2×2 factorial isolates each + interaction:
#
#   sync=100  + wd=0      baseline (Q-explodes, DDQN hurts)
#   sync=10000 + wd=0     slow-target only
#   sync=100   + wd=1e-3  weight-decay only
#   sync=10000 + wd=1e-3  Mnih-style full stabilization
#
# Discriminating prediction: if |A|=5 + dense-reward link_null is a
# Q-explosion artifact, the stabilized regime should show DDQN
# emerging as helpful (Δ > 0). If link_null persists in stabilized
# regime, the |A| upper boundary is real on dense MinAtar.
#
# 4 conditions × 2 arms × 30 seeds × 100k = 240 cells. GPU runtime
# ~30-60 min.

envs:
  - {name: Asterix-MinAtar, n_seeds: 30, chunk_size: 15}

base_intervention:
  total_steps: 100000
  eval_every:  10000
  n_episodes:  5
  gamma:       0.99
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [128]

hypotheses:
  - name: vanilla_sync100_wd0
    predicted_direction: null
    intervention:
      sync_period: 100
      optimizer:
        class: WarmedUpdate
        inner: {class: Adam, lr: 0.0001, weight_decay: 0.0}
        warmup_steps: 100
  - name: ddqn_sync100_wd0
    predicted_direction: a_gt_b
    intervention:
      sync_period: 100
      optimizer:
        class: WarmedUpdate
        inner: {class: Adam, lr: 0.0001, weight_decay: 0.0}
        warmup_steps: 100
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}

  - name: vanilla_sync10k_wd0
    predicted_direction: null
    intervention:
      sync_period: 10000
      optimizer:
        class: WarmedUpdate
        inner: {class: Adam, lr: 0.0001, weight_decay: 0.0}
        warmup_steps: 100
  - name: ddqn_sync10k_wd0
    predicted_direction: a_gt_b
    intervention:
      sync_period: 10000
      optimizer:
        class: WarmedUpdate
        inner: {class: Adam, lr: 0.0001, weight_decay: 0.0}
        warmup_steps: 100
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}

  - name: vanilla_sync100_wd1e3
    predicted_direction: null
    intervention:
      sync_period: 100
      optimizer:
        class: WarmedUpdate
        inner: {class: Adam, lr: 0.0001, weight_decay: 0.001}
        warmup_steps: 100
  - name: ddqn_sync100_wd1e3
    predicted_direction: a_gt_b
    intervention:
      sync_period: 100
      optimizer:
        class: WarmedUpdate
        inner: {class: Adam, lr: 0.0001, weight_decay: 0.001}
        warmup_steps: 100
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}

  - name: vanilla_sync10k_wd1e3
    predicted_direction: null
    intervention:
      sync_period: 10000
      optimizer:
        class: WarmedUpdate
        inner: {class: Adam, lr: 0.0001, weight_decay: 0.001}
        warmup_steps: 100
  - name: ddqn_sync10k_wd1e3
    predicted_direction: a_gt_b
    intervention:
      sync_period: 10000
      optimizer:
        class: WarmedUpdate
        inner: {class: Adam, lr: 0.0001, weight_decay: 0.001}
        warmup_steps: 100
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
