name: cartpole_sync_10k
out_dir: experiments/data/cartpole_sync_10k
arms_shape: paired

# Test whether Q-amplification on CartPole (σQ ratio = 3.70× at sync=100)
# disappears at sync=10000. Predicts: with proper Q stabilization, DDQN
# no longer has larger σQ than vanilla → confirms the amplification is
# Q-divergence-coupled, not intrinsic to DDQN on CartPole.

envs:
  - {name: CartPole-v1, n_seeds: 30, chunk_size: 30}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 10000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    class: WarmedUpdate
    inner: {class: Adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: vanilla_dqn_sync10k
    predicted_direction: null
    intervention: {}

  - name: ddqn_sync10k
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
