name: synthetic_bias_typeb_v2_pilot
out_dir: experiments/data/synthetic_bias_typeb_v2_pilot
env_binding: per_env
archive_remote: s3://corroborate-archive/synthetic_bias_typeb_v2_pilot

# v2 synthetic bias Type-A/B controlled-substrate sweep.
#
# v1 → v2: see `docs/PRE_REGISTRATION_synthetic_bias_typeb.md`
# + `/tmp/synthetic_env_roast.md`. v1 was scrapped (action-
# independent transitions made it a bandit in a tuxedo). v2 has
# action-dependent transitions, anisotropy_alpha as the
# Type-A/B axis, n_states as the FA-capacity axis, and γ ∈
# {0.95, 0.99, 0.999} as a load-bearing substrate axis.
#
# Panel: 6 envs × 3 γ × 2 arms × 12 seeds = 432 cells.
# CPU budget: ≤ 2h at the tabular-but-FA-bound env scale
# (n_states ≤ 64 → 100k steps × 432 cells × ~1 ms/step ≈ 12 CPU-h
# at full parallelism, ~1-2 wall-clock h on a 16-core box).
#
# Pre-registered bridges — sweep-launch commitments captured in
# `<out_dir>/pre_registration.json`. Each entry locks the bridge's
# source-hash, predicted direction, and predicted verdict at the
# git HEAD as of sweep launch. Post-sweep `corroborate audit
# pre-registration <corpus>` re-resolves each bridge, re-runs it
# against the corpus, and reports source-hash drift OR verdict
# drift — the framework-typed honest-reporting surface.
#
# These commitments encode the substantive predictions from
# `docs/PRE_REGISTRATION_synthetic_bias_typeb.md`:
#   P1: ρ(α, d_out) ≤ −0.4 pooled (HELD-direction='a_lt_b')
#   P2: ρ(α, d_out) ≤ −0.5 at γ=0.999 (HELD-direction='a_lt_b')
#   P3: ρ(α × log(L), d_out) ≤ −0.4 (HELD-direction='a_lt_b')
#   N1: |ρ(L, d_out)| ≤ 0.3 at α=0 (HELD under
#       `predicted_direction='null'` — pytest-xfail analog)
pre_registered_bridges:
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.ddqn_harms_under_positive_alpha__synthetic_typeb_v2
    predicted_direction: a_lt_b
    predicted_verdict: held
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.ddqn_harm_amplified_at_g999__synthetic_typeb_v2
    predicted_direction: a_lt_b
    predicted_verdict: held
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.ddqn_harm_scales_with_type_b_score__synthetic_typeb_v2
    predicted_direction: a_lt_b
    predicted_verdict: held
  - bridge: experiments.findings.ddqn_sweeps.synthetic_bias_typeb.n_states_alone_does_not_predict_dout__synthetic_typeb_v2
    predicted_direction: 'null'
    predicted_verdict: held

# 6 v2 envs: 2 n_states × 3 anisotropy_alpha levels.
envs:
  - {name: TypeBChainV2-K4-L16-alpha-0.5-synthetic, n_seeds: 12, chunk_size: 6}
  - {name: TypeBChainV2-K4-L16-alpha0.0-synthetic, n_seeds: 12, chunk_size: 6}
  - {name: TypeBChainV2-K4-L16-alpha0.5-synthetic, n_seeds: 12, chunk_size: 6}
  - {name: TypeBChainV2-K4-L64-alpha-0.5-synthetic, n_seeds: 12, chunk_size: 6}
  - {name: TypeBChainV2-K4-L64-alpha0.0-synthetic, n_seeds: 12, chunk_size: 6}
  - {name: TypeBChainV2-K4-L64-alpha0.5-synthetic, n_seeds: 12, chunk_size: 6}

defaults:
  # 100k steps balances FA learning time against cell budget.
  # The env's deterministic transitions + tabular ground truth
  # mean vanilla learns to approximate Q* quickly; we need
  # enough steps for the anisotropy axis to dominate over
  # initialisation noise.
  total_steps: 100000
  eval_every:  5000
  n_episodes:  10
  gamma:       0.99
  sync_period: 200
  replay:
    class: Replay
    capacity: 20000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0003}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 40000
  q_network:
    class: MLP
    # 32-unit hidden width: representational capacity for K × L
    # = 4 × 16 = 64 distinct Q values is ample; for K × L = 256
    # the same MLP becomes capacity-bound (the FA-capacity axis
    # the v2 design tests).
    hidden: [32, 32]

# γ × DDQN-vs-vanilla cross. Each γ level has 2 arms (vanilla
# baseline + DDQN treatment); the YAML expands to 3 γ × 2 arms ×
# 6 envs × 12 seeds = 432 cells via env_binding=per_env.
interventions:
  - name: "g095_{from_env: name}"
    base: {gamma: 0.95}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: "g099_{from_env: name}"
    base: {gamma: 0.99}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: "g0999_{from_env: name}"
    base: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
