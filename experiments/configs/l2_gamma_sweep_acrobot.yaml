name: l2_gamma_sweep_acrobot
out_dir: experiments/data/l2_gamma_sweep_acrobot
arms_shape: chunked
archive_remote: s3://corroborate-archive/l2_gamma_sweep_acrobot

# L2-regularized γ-sweep on Acrobot-v1 — replaces the
# contaminated pre-buffer-fix `l2_x_gamma_acrobot` corpus that
# `acrobot_per_burst_link_active__gamma_0999` bridge's
# `weight_decay==0.0001` filter targets.
#
# Mirrors `gamma_sweep_acrobot.yaml` (γ ∈ {0.99, 0.995, 0.999}
# × 2 arms × 30 seeds × 200k) but with Adam wd=0.0001 (light L2)
# instead of wd=0. Tests whether the per-burst bias→outcome link
# fires on Acrobot γ=0.999 under L2 regularization, in the
# regime where prior (contaminated) data showed plc=1.0,
# r ≈ -0.93 to -0.998 — fresh substrate needed because the
# pre-buffer-fix data drifted.
#
# 3 γ × 2 arms × 30 seeds × 200k ≈ 15 min wall on MLP [64, 64].

envs:
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 30}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99            # per-template override below
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001, weight_decay: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: l2_gamma_sweep_g099
    predicted_direction: a_gt_b
    intervention: {gamma: 0.99}
    arms:
      - []   # vanilla
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: l2_gamma_sweep_g0995
    predicted_direction: a_gt_b
    intervention: {gamma: 0.995}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: l2_gamma_sweep_g0999
    predicted_direction: a_gt_b
    intervention: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
