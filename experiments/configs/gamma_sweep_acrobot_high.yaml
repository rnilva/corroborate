name: gamma_sweep_acrobot_high
out_dir: experiments/data/gamma_sweep_acrobot_high
env_binding: shared
archive_remote: s3://corroborate-archive/gamma_sweep_acrobot_high

# Test if Acrobot activates the chain-depth signature at γ=0.999.
envs:
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: vanilla_dqn_g0999
    base:
      gamma: 0.999
  - name: ddqn_g0999
    base:
      gamma: 0.999
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
