name: snake_g099_canonical_3M_ckpt
out_dir: experiments/data/snake_g099_canonical_3M_ckpt
env_binding: shared
archive_remote: s3://corroborate-archive/snake_g099_canonical_3M_ckpt
deterministic: false

# Snake-jumanji γ=0.99 canonical at 3M steps with full Q traces +
# per-burst Q checkpoints + per-action online/target Q.
#
# Repro setup per Hasselt-floor RL conventions:
#   - `deterministic: false` skips `--xla_gpu_deterministic_ops=true`
#     (the 10-30× perf cost on Jumanji's tiny-op step is prohibitive
#     at 3M steps).
#   - The runner reads XLA_FLAGS for `--xla_gpu_enable_command_buffer=`
#     (explicit empty = disabled); set the env var before invoking
#     the sweep:
#       export XLA_FLAGS=--xla_gpu_enable_command_buffer=
#     Both flags are stamped per-RunRow (cell_runner's
#     `xla_deterministic_ops` / `xla_command_buffer_enabled` columns)
#     so the (no-det, no-cmdbuf) provenance is durably recorded.
#
# Canonical Jumanji HPs from prior g0999_panel_extension_snake_only
# (capacity=50000, channels=[8,16], hidden=[64], chunk_size=10) at
# γ=0.99 instead of 0.999 and 3× total_steps. eval_every=20000 keeps
# burst spacing constant → 150 bursts × seeds × cells of Q snapshots.
#
# Cells: 2 arms × 2 chunks of 15 seeds = 4 batched cells. chunk=15
# probed against the 32 GiB RTX 5090: chunk=10 baseline took ~17.5
# GiB; chunk=15 expected ~26 GiB (linear scaling), leaving ~6 GiB
# headroom. Bundle layout: 4 cell{NNN}.msgpack files (vs 9060
# per-file under the pre-bundle layout, where chunk=10 would have
# produced 6060).

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true
keep_q_per_action: true

envs:
  - {name: Snake-jumanji, n_seeds: 30, chunk_size: 15}

defaults:
  total_steps: 3000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [12, 12, 5]
    channels: [8, 16]
    kernel_size: 3
    hidden: [64]

interventions:
  - name: canonical_g099_3M
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
