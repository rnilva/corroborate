name: minatar_sync_curve_resume
out_dir: experiments/data/minatar_sync_curve_resume
arms_shape: paired
archive_remote: s3://corroborate-archive/minatar_sync_curve_resume

# Resume of `minatar_sync_curve` after the GPU run died ~2026-05-05
# 00:11 UTC mid-Freeway. Three changes from the original config:
#
# 1. Envs reduced to {Freeway, SpaceInvaders}. Breakout is fully
#    complete in `experiments/data/minatar_sync_curve/{ddqn_sync1k,
#    ddqn_sync3k}/runs.parquet` and not at risk of being touched.
#
# 2. The redundant `vanilla_sync*` hypotheses are dropped. Each had
#    `intervention_arms: ()`, which means DoEffect's treatment_claim
#    == baseline_claim — so every seed was trained TWICE under the
#    same vanilla configuration (60 rows / 30 unique seeds). The
#    paired `ddqn_sync*` hypotheses already produce the vanilla
#    baseline arm at the matching sync_period, so dropping them
#    loses nothing.
#
# 3. `out_dir` and `archive_remote` are namespaced separately. The
#    original sweep had ALL 4 hypotheses sharing
#    `s3://...minatar_sync_curve/tmp/cell{NNN}__{env}__{arm}.parquet`
#    paths — last writer wins, so cells got silently overwritten on
#    cloud. A fresh root avoids re-corrupting the existing archive.
#
# Remaining work: 2 envs × 2 sync values × 2 arms × 30 seeds = 240
# cells at 1M steps. ~25 min/cell on the prior GPU = ~100h serial,
# ~25h with the same 4-way parallelism the original sweep had.

envs:
  # Freeway kept at chunk_size=15 — existing ddqn_sync1k cells are at
  # this layout (already on cloud); changing would force re-run.
  - {name: Freeway-MinAtar,        n_seeds: 30, chunk_size: 15}
  # SpaceInvaders dropped to chunk_size=10 — no existing SI cells, so
  # no waste. Smaller per-cell shards (~600 MB vs 880 MB) may avoid
  # the post-merge hang we hit twice on Freeway-ddqn_sync1k.
  - {name: SpaceInvaders-MinAtar,  n_seeds: 30, chunk_size: 10}

base_intervention:
  total_steps: 1000000
  eval_every:  50000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [128]

hypotheses:
  - name: ddqn_sync1k
    predicted_direction: a_gt_b
    intervention:
      sync_period: 1000
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}

  - name: ddqn_sync3k
    predicted_direction: a_gt_b
    intervention:
      sync_period: 3000
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
