name: minatar_gamma_sweep_k4
out_dir: experiments/data/minatar_gamma_sweep_k4
env_binding: per_env
archive_remote: s3://corroborate-archive/minatar_gamma_sweep_k4

# γ-sweep on 4 MinAtar envs with k=1 (action_duplicate k=4).
# Part of the γ × k disambiguation: this YAML covers the k=4 slice.
# Companion sweeps: minatar_gamma_sweep_k2.yaml, minatar_gamma_sweep_k4.yaml.
#
# Per-env attrs only expose `name`, so we split by k across YAMLs
# rather than templating the intervention name with the k value.
#
# 4 envs × 3 γ ∈ {0.95, 0.99, 0.999} × 2 arms × 30 seeds = 720 cells.
#
# Canonical MinAtar HPs (matching `_PER_ENV_CANONICAL` in
# `experiments/findings/ddqn/_scope.py`).

envs:
  - {name: Asterix-MinAtar, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 4}]}
  - {name: Breakout-MinAtar, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 4}]}
  - {name: Freeway-MinAtar, n_seeds: 30, chunk_size: 5, wrappers: [{type: action_duplicate, k: 4}]}
  - {name: SpaceInvaders-MinAtar, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 4}]}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: "g095_{from_env: name}"
    base: {gamma: 0.95}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: "g099_{from_env: name}"
    base: {gamma: 0.99}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: "g0999_{from_env: name}"
    base: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
