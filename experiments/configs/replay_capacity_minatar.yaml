name: replay_capacity_minatar
out_dir: experiments/data/replay_capacity_minatar
env_binding: per_env
archive_remote: s3://corroborate-archive/replay_capacity_minatar

# Replay-capacity probe on Asterix + Freeway MinAtar at 1M.
# **N-arm single intervention** — one `arms:` list with 4 entries:
# empty-tuple control (vanilla, default 50k) + 3 capacity
# replacements {5k, 50k-explicit, 200k}. The framework's
# `DoEffect` supports multi-arm dispatch, so the dispatcher routes
# one cell per (env, arm, seed) without the binary-contrast
# doubling. Vanilla is trained ONCE per env (shared baseline),
# not three times.
#
# `env_binding: per_env` is required because the CNN `obs_shape:
# {from_env: observation_shape}` placeholder only resolves in
# per-env dispatch (shared-mode build path has no env_attrs
# context). Each (template × env) build resolves once.
#
# Companion to `lr_sweep_minatar_1M` (archived at
# `experiments/probes/lr_sweep_minatar_1M/`, refuted "under-
# training is lr-bound"). lr=1e-4 sync=500 is the converged
# regime; this probe asks whether smaller replay destabilises
# the vanilla Q (mechanism activation) or whether the converged
# regime survives capacity changes.
#
# 4 arms × 2 envs × 5 seeds = 40 cells. chunk_size=5 (matches
# lr-sweep precedent; at 200k capacity the buffer ~doubles vs
# 50k but stays under the 16 GiB headroom).

envs:
  - {name: Asterix-MinAtar, n_seeds: 5, chunk_size: 5}
  - {name: Freeway-MinAtar, n_seeds: 5, chunk_size: 5}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 500
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: "replay_capacity_{from_env: name}"
    arms:
      - []  # empty-tuple control — uses defaults' replay (50k)
      - - slot_path: replay
          replacement: {class: Replay, capacity: 5000, batch_size: 32}
      - - slot_path: replay
          replacement: {class: Replay, capacity: 50000, batch_size: 32}
      - - slot_path: replay
          replacement: {class: Replay, capacity: 200000, batch_size: 32}
