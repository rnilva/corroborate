name: asterix_g0999_adamw_wd1e3_ckpt_seeds15to29
out_dir: experiments/data/asterix_g0999_adamw_wd1e3_ckpt_seeds15to29
env_binding: shared
archive_remote: s3://corroborate-archive/asterix_g0999_adamw_wd1e3_ckpt_seeds15to29

# Partner sweep — adds seeds 15..29 to the AdamW wd=1e-3 sweet-spot
# corpus (asterix_g0999_adamw_wd1e3_ckpt has seeds 0..14). Pool at
# analysis time → n=30 per arm to tighten d_raw CI.
#
# Original n=15 finding: d_final=-0.19, Bootstrap CI95=[+0.36,+2.77]
# on shift_final, Wilcoxon p=0.005. With n=30 the CI should tighten
# ~√2.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true

envs:
  - {name: Asterix-MinAtar, n_seeds: 15, chunk_size: 15, seed_offset: 15}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.999
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001, weight_decay: 0.001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: adamw_wd1e3
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
