name: replay_capacity_probe_lunarlander_g0999
out_dir: experiments/probes/replay_capacity_probe_lunarlander_g0999
env_binding: shared
archive_remote: s3://corroborate-archive/replay_capacity_probe_lunarlander_g0999

merge_top_level: false

# Replay capacity probe on LunarLander γ=0.999 at sync=1000 (the
# "tuned" canonical that solves γ=0.99 in `lunarlander_tuned_sync1000_gpu`).
# Pre-registered test of "DDQN as stale-target-feedback-breaker"
# vs "DDQN as bias-clip" mechanism on LL γ=0.999.
#
# ## Mechanism dissection (from tuned LL γ=0.999 data)
#
# n=30 at sync=1000 capacity=50k:
#   V: mean=-148.4, SD=467, catastrophic (<-200) seeds=6/30
#   D: mean= -25.5, SD=101, catastrophic seeds=2/30
#   Cohen d (late_window, D-V) = +0.36
#
# DDQN's γ=0.999 advantage is dominated by RESCUING catastrophic
# V seeds (medians V=-30 vs D=-22 are nearly equal). DDQN is
# acting as a *variance-reducer / failure-mode rescuer*, not as
# a uniform mean-shifter (would predict if it were Hasselt's
# max-of-K bias clip).
#
# Working hypothesis: at sync=1000 + capacity=50k, the buffer
# cycles every ~50k env steps while target net updates every
# 1000 steps. Near-on-policy samples dominate the replay buffer,
# Q target chases its own recent updates, and a fraction of V
# seeds enter divergent runaway. DDQN's argmax-decoupling breaks
# that feedback. Raising buffer capacity 5× should preserve older
# off-policy samples → V's runaway feedback breaks → D's marginal
# advantage collapses.
#
# ## Pre-registered prediction (`replay_capacity_breaks_ddqn_advantage__lunar_g0999`):
#
# - predicted_direction: a_lt_b  (capacity↑ → d(D-V)↓)
# - predicted_verdict at cap=250k: null_effect, |d| ≤ 0.15
# - secondary: V catastrophic rate (late<-200) at cap=250k ≤ 2/30
#   (one-sided Fisher vs 6/30 baseline, p ≤ 0.13)
#
# ## RETRACTION criteria (any of):
# 1. d(D-V; cap=250k) ≥ +0.30 → DDQN's role is NOT capacity-mediated
#    → routes back to true bias-clip / Λ_a frame.
# 2. V catastrophic rate at cap=250k ≥ 5/30 → capacity isn't load-bearing.
# 3. V mean at cap=250k < V mean at cap=50k by ≥ 1 SE → bigger buffer HURTS vanilla
#    (off-policy staleness wrt current Q dominates) → mechanism is reversed.
#
# A clean confirmation establishes a *4th DDQN role*:
# stale-target-feedback-breaker, distinct from
# bias-clip (Hasselt canonical), lr-rescuer (LL γ=0.99 lr=5e-4),
# information-destroyer (Asterix γ=0.999).
#
# Cells: 1 env × 2 capacities × 2 arms × 30 seeds = 4 cells, n=30
# vmapped. CPU wall ≈ ~45 min/cell × 4 = ~3h.

envs:
  - {name: LunarLander-v2-jax, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.999
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000

interventions:
  - name: cap50k_baseline
    base:
      replay:
        class: Replay
        capacity: 50000
        batch_size: 32
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: cap250k_treatment
    base:
      replay:
        class: Replay
        capacity: 250000
        batch_size: 32
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
