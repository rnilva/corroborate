name: gamma_sweep_metamaze
out_dir: experiments/data/gamma_sweep_metamaze
env_binding: shared
archive_remote: s3://corroborate-archive/gamma_sweep_metamaze

# Test the prediction: chain-depth-as-amplifier should reproduce on
# MetaMaze (matches FourRooms's |A|=4 + structured navigation +
# partial-progress profile, modulo a shorter 200-step horizon).
envs:
  - {name: MetaMaze-misc, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: vanilla_dqn_g099
    base:
      gamma: 0.99
  - name: ddqn_g099
    base:
      gamma: 0.99
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: vanilla_dqn_g095
    base:
      gamma: 0.95
  - name: ddqn_g095
    base:
      gamma: 0.95
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: vanilla_dqn_g090
    base:
      gamma: 0.90
  - name: ddqn_g090
    base:
      gamma: 0.90
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
