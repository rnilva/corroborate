name: gamma_sweep_metamaze
out_dir: experiments/data/gamma_sweep_metamaze
arms_shape: chunked
archive_remote: s3://corroborate-archive/gamma_sweep_metamaze

# Test the prediction: chain-depth-as-amplifier should reproduce on
# MetaMaze (matches FourRooms's |A|=4 + structured navigation +
# partial-progress profile, modulo a shorter 200-step horizon).
envs:
  - {name: MetaMaze-misc, n_seeds: 30, chunk_size: 30}

base_intervention:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    class: WarmedUpdate
    inner: {class: Adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

hypotheses:
  - name: vanilla_dqn_g099
    predicted_direction: null
    intervention:
      gamma: 0.99
  - name: ddqn_g099
    predicted_direction: a_gt_b
    intervention:
      gamma: 0.99
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}

  - name: vanilla_dqn_g095
    predicted_direction: null
    intervention:
      gamma: 0.95
  - name: ddqn_g095
    predicted_direction: a_gt_b
    intervention:
      gamma: 0.95
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}

  - name: vanilla_dqn_g090
    predicted_direction: null
    intervention:
      gamma: 0.90
  - name: ddqn_g090
    predicted_direction: a_gt_b
    intervention:
      gamma: 0.90
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
