name: cartpole_g099_200k_cpu
out_dir: experiments/data/cartpole_g099_200k_cpu
env_binding: shared
archive_remote: s3://corroborate-archive/cartpole_g099_200k_cpu

# CartPole γ=0.99 at 200k steps (vs canonical 100k), 50 bursts at
# eval_every=4000. Motivation: the 100k canonical CartPole saturates
# both arms at the env reward cap (29/30 V + 28/30 D peak at 500),
# making `eval_best_burst_raw_mean` uninformative as a treatment-effect
# proxy. 200k either removes the saturation or exposes a meaningful
# post-saturation stability difference between V and D (cf. `report.md`
# Layer 2 saturation footnote).
#
# CartPole is effectively deterministic → n_episodes=1.
# n_seeds=30, single chunk → matches canonical seed count without
# the seeds15to29 pairing.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true
keep_q_per_action: true

envs:
  - {name: CartPole-v1, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  4000
  n_episodes:  1
  gamma:       0.99
  sync_period: 100
  n_step:      1
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000  # full anneal by mid-training, like canonical
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: canonical_g099_200k
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
