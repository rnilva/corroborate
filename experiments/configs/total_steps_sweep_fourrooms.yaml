name: total_steps_sweep_fourrooms
out_dir: experiments/data/total_steps_sweep_fourrooms
arms_shape: chunked
archive_remote: s3://corroborate-archive/total_steps_sweep_fourrooms

# Vary `total_steps` (literal chain depth bound) at γ=0.99 fixed
# (eff_h≈100 theoretical). Tests whether chain-depth amplifier is
# bounded by min(length, eff_h) — should plateau once length >> eff_h.
envs:
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}

base_intervention:
  total_steps: 200000
  eval_every:  10000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

# 5 lengths × 2 arms = 10 hypotheses. 25k/50k/100k/200k/500k.
# (1M is the fourrooms_1m sweep; we already have that.)
hypotheses:
  - name: vanilla_25k
    predicted_direction: null
    intervention: {total_steps: 25000, eval_every: 2500}
  - name: ddqn_25k
    predicted_direction: a_gt_b
    intervention:
      total_steps: 25000
      eval_every: 2500
      bootstrap: {fn: bootstrap, greedification: {fn: double_greedify}}
    intervention_arms:
      - slot_path: bootstrap
        replacement: {fn: bootstrap, greedification: {fn: double_greedify}}

  - name: vanilla_50k
    predicted_direction: null
    intervention: {total_steps: 50000, eval_every: 5000}
  - name: ddqn_50k
    predicted_direction: a_gt_b
    intervention:
      total_steps: 50000
      eval_every: 5000
      bootstrap: {fn: bootstrap, greedification: {fn: double_greedify}}
    intervention_arms:
      - slot_path: bootstrap
        replacement: {fn: bootstrap, greedification: {fn: double_greedify}}

  - name: vanilla_100k
    predicted_direction: null
    intervention: {total_steps: 100000, eval_every: 10000}
  - name: ddqn_100k
    predicted_direction: a_gt_b
    intervention:
      total_steps: 100000
      eval_every: 10000
      bootstrap: {fn: bootstrap, greedification: {fn: double_greedify}}
    intervention_arms:
      - slot_path: bootstrap
        replacement: {fn: bootstrap, greedification: {fn: double_greedify}}

  - name: vanilla_200k
    predicted_direction: null
    intervention: {total_steps: 200000, eval_every: 20000}
  - name: ddqn_200k
    predicted_direction: a_gt_b
    intervention:
      total_steps: 200000
      eval_every: 20000
      bootstrap: {fn: bootstrap, greedification: {fn: double_greedify}}
    intervention_arms:
      - slot_path: bootstrap
        replacement: {fn: bootstrap, greedification: {fn: double_greedify}}

  - name: vanilla_500k
    predicted_direction: null
    intervention: {total_steps: 500000, eval_every: 25000}
  - name: ddqn_500k
    predicted_direction: a_gt_b
    intervention:
      total_steps: 500000
      eval_every: 25000
      bootstrap: {fn: bootstrap, greedification: {fn: double_greedify}}
    intervention_arms:
      - slot_path: bootstrap
        replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
