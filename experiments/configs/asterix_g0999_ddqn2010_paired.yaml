name: asterix_g0999_ddqn2010_paired
out_dir: experiments/data/asterix_g0999_ddqn2010_paired
env_binding: shared

# Deep-2010 Double Q-learning (independent-estimator SELECTION) at
# Asterix-MinAtar γ=0.999, canonical HPs. The deep-2010 arm runs the
# `paired_dqn` PROGRAM: two coupled learners (A acting, B co-learning)
# over one shared rollout + replay, A's bootstrap argmax evaluated by
# B's target and vice-versa — van Hasselt 2010 as its own root claim,
# not a slot config of `dqn`. This is the canonical deep-2010 sweep:
# the earlier crude `double_greedify_indep` marker on the single-net
# `dqn` program was retired after this program reproduced its result
# (outcome distributionally identical under BH-FDR/Bonferroni across
# 12 measurables; jensen_gap bit-identical at 0.0; per-seed divergence
# is chaotic 1M-step PRNG-tree drift, structural measurables within
# 1-3%).
#
# The free-lunch / separability test: does an INDEPENDENT selector
# reduce overestimation (jensen_gap) like DDQN-2016 but WITHOUT the harm?
#
# Arms:
#   deep2010 — `program: paired_dqn`, EMPTY arm. The cross-evaluation is
#       STRUCTURAL to the program (no marker, no slot swap). Net B is
#       trained independently (own init/opt/target/minibatch, vanilla
#       loss) and routed into A's bootstrap argmax. Program identity is
#       recorded on the typed `RunRow.program` column ('paired_dqn'),
#       so this arm's `arm_key` is the pure `'baseline'` fingerprint —
#       distinguished from vanilla by `program`, NOT by an arm_key
#       marker. Contrast cells via `pl.col('program') == 'paired_dqn'`.
#   vanilla — `program: dqn` (default), empty arm. Matched-seed
#       reference + positivity check (single net, no B).
#
# DDQN-2016 is NOT re-run (already in the canonical corpus). No Q
# checkpoints — eval_best_burst_raw_mean + jensen_gap come from the
# in-training eval traces, which don't need saved Q-nets.
#
# Adjudication vs canonical d_2016=-0.68:
#   FREE LUNCH   — d_2010 ≈ 0 AND jensen_gap reduced like DDQN-2016.
#   INSEPARABLE  — d_2010 ≈ -0.68 (→ "better DDQN here = vanilla").
#
# Ordering: TWO interventions (deep-2010 FIRST, vanilla SECOND), 1 arm
# each. dispatch_sweep runs interventions sequentially, so the paired
# arm FINISHES before vanilla starts. Cells: 2 × 30 seeds, chunk_size=30.
# The paired cells are ~2× compute (train B too); vanilla normal.

keep_q_checkpoint_per_burst: false
keep_q_checkpoint_final: false
archive_remote: s3://corroborate-archive/asterix_g0999_ddqn2010_paired

# This study measures jensen_gap + eval return (both trace-based) —
# it does NOT consume the gradient-overlap measurables, so skip the
# O(n_actions × n_params) jacrev probes entirely. Combined with
# paired_step's B-side `probes=False`, neither learner pays the
# probe cost: ~2× less compute per paired cell on this CNN env.
gradient_probes: false

envs:
  - {name: Asterix-MinAtar, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.999
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]   # Asterix-MinAtar; explicit (env_binding: shared has no from_env context)
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  # deep-2010 FIRST — the paired_dqn program. The cross-evaluation is
  # structural, so the arm is EMPTY (no marker). Finishes before vanilla
  # (interventions dispatch sequentially).
  - name: deep2010
    program: paired_dqn
    base: {}
    arms:
      - []
  # vanilla SECOND — matched-seed reference + positivity check (single
  # net, no B). DDQN-2016 NOT re-run (canonical). program defaults to dqn.
  - name: vanilla
    base: {}
    arms:
      - []
