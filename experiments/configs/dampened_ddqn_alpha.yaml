name: dampened_ddqn_alpha
out_dir: experiments/data/dampened_ddqn_alpha
env_binding: shared
archive_remote: s3://corroborate-archive/dampened_ddqn_alpha

# Single env, single γ — α is the only varied factor. Tests the
# multiplicative claim g_link ≈ ε · effective_horizon by varying ε
# (= α · σ_Q · √(2 log |A|)) while holding eff_h fixed.
envs:
  - {name: FourRooms-misc, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 200000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99   # fixed → eff_h ≈ 72 on FourRooms (bf=0.996)
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: MLP
    hidden: [64, 64]

# 5 α values: 0.0 (vanilla), 0.25, 0.5, 0.75, 1.0 (full DDQN).
# Per-step ε = α · σ_Q · √(2 log |A|).
# Predicted g_link: 0, +0.28, +0.55, +0.83, +1.11 (linear in α).
interventions:
  - name: dampened_a000
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.0}

  - name: dampened_a025
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.25}

  - name: dampened_a050
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.5}

  - name: dampened_a075
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 0.75}

  - name: dampened_a100
    arms:
      - []  # vanilla control
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: dampened_double_greedify, alpha: 1.0}
