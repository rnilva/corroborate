name: breakout_g099_canonical_n_eps1_ckpt
out_dir: experiments/data/breakout_g099_canonical_n_eps1_ckpt
env_binding: shared
archive_remote: s3://corroborate-archive/breakout_g099_canonical_n_eps1_ckpt

# Breakout-MinAtar γ=0.99 canonical with full Q traces + per-burst Q
# checkpoints, n_episodes=1. Breakout has 1 RNG call per transition
# (low-stochasticity per the gymnax source) — n_eps=1 is a reasonable
# eval budget.
#
# obs_shape=(10, 10, 4) — smaller than SI's 6-channel obs; chunk_size=15
# matches the canonical MinAtar footprint (could probably push higher,
# but keeping it uniform with SI / Freeway for a clean cross-env panel).
#
# Cells: 2 arms × 2 chunks of 15 seeds = 4 batched cells.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true
keep_q_per_action: true

envs:
  - {name: Breakout-MinAtar, n_seeds: 30, chunk_size: 15}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  1
  gamma:       0.99
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: canonical_g099_n_eps1
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
