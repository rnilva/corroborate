name: batch_probe_lunarlander_lr3e4
out_dir: experiments/probes/batch_probe_lunarlander_lr3e4
env_binding: shared
archive_remote: s3://corroborate-archive/batch_probe_lunarlander_lr3e4

merge_top_level: false

# Batch size probe on LunarLander γ=0.99 at lr=3e-4 (the vanilla peak
# from the LR probe). Test whether batch=128 pushes vanilla above the
# +200 solve threshold at lr=3e-4.
#
# Context:
# - LR probe (`lr_probe_lunarlander`, 2026-05-20) found vanilla best at
#   lr=3e-4 with V_late=189 ± wide variance (n=10, batch=32). Close to
#   solve threshold but not consistent.
# - Memory `findings_lemma4_b_invariance_refuted`: small B amplifies
#   bias-attraction at high γ; ρ(B, jens) = −0.83 at FR γ=0.999.
# - SB3-zoo standard for LL is batch=128.
#
# Pre-reg prediction: vanilla mean late_window ≥ 200 at batch=128
# (solves LL); DDQN's lr-rescue mechanism diminishes at larger batch
# (since vanilla becomes stable).
#
# Cells: 1 env × 3 batch × 2 arms = 6 cells, n_seeds=10 vmapped.
# Batch=32 wall ~18 min, batch=64 ~25 min, batch=128 ~40 min (compute
# scales linearly with batch on CPU). Total ~2.7h.

envs:
  - {name: LunarLander-v2-jax, n_seeds: 10, chunk_size: 10}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0003}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000

interventions:
  - name: b32
    base:
      replay:
        class: Replay
        capacity: 50000
        batch_size: 32
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: b64
    base:
      replay:
        class: Replay
        capacity: 50000
        batch_size: 64
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: b128
    base:
      replay:
        class: Replay
        capacity: 50000
        batch_size: 128
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
