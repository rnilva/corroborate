name: g0999_panel_extension_lunar_cpu
out_dir: experiments/data/g0999_panel_extension_lunar_cpu
env_binding: per_env
archive_remote: s3://corroborate-archive/g0999_panel_extension_lunar_cpu

# T3a γ=0.999 panel extension — LunarLander only, on CPU.
# Filtered from `g0999_panel_extension_mlp.yaml` (which also
# includes Acrobot). Run while GPU is occupied by the k=4
# minatar sweep. LunarLander is the highest-uncertainty
# borderline-Λ_m env from the T3a prediction set
# (Λ_m≈1.66; see memory `findings-prospective-predictions-t3a-lambda-m`).
#
# 1 env × 1 γ × 2 arms × 30 seeds vmapped = 2 cells.
# Canonical MLP HPs for LunarLander.

envs:
  - {name: LunarLander-v2-jax, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.999
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: MLP
    hidden: [64, 64]

interventions:
  - name: "g0999_{from_env: name}"
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
