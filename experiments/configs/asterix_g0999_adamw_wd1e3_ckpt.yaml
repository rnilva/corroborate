name: asterix_g0999_adamw_wd1e3_ckpt
out_dir: experiments/data/asterix_g0999_adamw_wd1e3_ckpt
env_binding: shared
archive_remote: s3://corroborate-archive/asterix_g0999_adamw_wd1e3_ckpt

# Asterix γ=0.999 canonical HPs but AdamW with weight_decay=1e-3
# (vs canonical's plain Adam, weight_decay=0). Tests whether
# explicit L2 regularization on Q-net weights reproduces the
# action_duplicate-helps effect at γ=0.999.
#
# Motivation: empirically, action_duplicate k=2 helps BOTH V and D
# at Asterix γ=0.999 (V: +1.7 eval at matched n_eps=5; Q-magnitude
# 2.3× larger; normalized argmax entropy 27% → 45% of max). The
# self-reference-rate-halving theory was REFUTED (predicted smaller
# Q, observed larger). What remains is the policy-concentration
# story: k=2 yields measurably less concentrated argmax in both
# arms. Hypothesis: action_dup is implicitly Q-net-regularizing
# (output-layer duplicate-label constraint = soft Q-smoothness
# regularization).
#
# Test: replace Adam with AdamW (decoupled weight decay 1e-3).
# This is an EXPLICIT L2 regularizer on Q-net weights without
# changing action space.
#
# Predictions under "regularization is the load-bearing mechanism":
#   - V's eval improves over canonical −10.41
#   - D's eval improves over canonical −8.70
#   - d_raw shrinks from canonical −0.68 toward zero
#   - Q-magnitude DECREASES (weight decay → smaller weights → smaller Q)
#   - argmax entropy INCREASES (smoother Q surface → less peaked argmax)
#
# Counterpoint: if AdamW doesn't help V, then action_dup's mechanism
# is NOT generic L2 regularization — must be something specific to
# the duplicate-action-space structure (label noise, exploration,
# inner-action coverage).
#
# weight_decay=1e-3 chosen as moderate: same order as lr=1e-4 × 10,
# strong enough to bound Q-net norms but not so aggressive as to
# prevent learning. If signal is ambiguous, follow-up at 1e-4 / 1e-2.
#
# Cells: 1 intervention × 2 arms × 15 seeds = 30 cells.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true

envs:
  - {name: Asterix-MinAtar, n_seeds: 15, chunk_size: 15}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.999
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001, weight_decay: 0.001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: adamw_wd1e3
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
