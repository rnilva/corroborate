name: lr_probe_lunarlander
out_dir: experiments/probes/lr_probe_lunarlander
env_binding: shared
archive_remote: s3://corroborate-archive/lr_probe_lunarlander

merge_top_level: false

# LunarLander-v2-jax LR probe at γ=0.99.
#
# Canonical T3a HPs (MLP[64,64], lr=1e-4, batch=32, sync=100,
# replay=50k) reached vanilla=+182 / DDQN=+181 best-burst on
# LunarLander γ=0.99 — close to but not solving (need ≥200).
# Community DQN configs (SB3-zoo, HF sb3, Neuromatch) converge on
# lr ∈ [5e-4, 6.3e-4] for [64,64] LunarLander. The canonical 1e-4
# is ~5× too small.
#
# This probe sweeps lr ∈ {1e-4 (canonical baseline), 3e-4, 5e-4,
# 1e-3} keeping everything else canonical, to isolate the lr
# contribution before iterating to other HPs (batch, sync, eps).
#
# Pre-registered prediction: lr ∈ {5e-4, 1e-3} → vanilla outcome
# exceeds 200 (solves LL); lr=1e-4 reproduces canonical-fail.
# DDQN arm tracks vanilla similarly (small expected effect at
# γ=0.99 per memory `findings-lunarlander-g999-t3a-addition`).
#
# Cells: 1 env × 4 lr × 2 arms = 8 cells. Each cell vmaps n_seeds=10.
# Wall time ≈ 8 × ~25 min/cell ≈ 3.3h on CPU.

envs:
  - {name: LunarLander-v2-jax, n_seeds: 10, chunk_size: 10}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000

interventions:
  - name: lr_1e-4_canonical
    base:
      optimizer:
        fn: warmed_update
        inner: {fn: adam, lr: 0.0001}
        warmup_steps: 100
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: lr_3e-4
    base:
      optimizer:
        fn: warmed_update
        inner: {fn: adam, lr: 0.0003}
        warmup_steps: 100
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: lr_5e-4
    base:
      optimizer:
        fn: warmed_update
        inner: {fn: adam, lr: 0.0005}
        warmup_steps: 100
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: lr_1e-3
    base:
      optimizer:
        fn: warmed_update
        inner: {fn: adam, lr: 0.001}
        warmup_steps: 100
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
