name: lunarlander_tuned_sync1000_gpu
out_dir: experiments/data/lunarlander_tuned_sync1000_gpu
env_binding: per_env
archive_remote: s3://corroborate-archive/lunarlander_tuned_sync1000_gpu

# LunarLander-v2-jax × γ ∈ {0.99, 0.999} with the sync_period=1000
# tuning discovered by `sync_probe_lunarlander_canonical` (n=5):
# vanilla mean late_window=+206 at sync=1000 SOLVES LL.
#
# Walks back the previous LL HP narrative: the canonical T3a
# sync_period=100 (matching Acrobot/MountainCar) was the load-
# bearing misconfiguration for LunarLander. Network architecture
# [64,64], lr=1e-4, batch=32, eps_anneal=100k all remain canonical.
#
# n=30 seeds for publishable power. 2 γ × 2 arms × 30 seeds = 4 cells.
# On GPU, expected ~10 min/cell × 4 = ~45 min total.

envs:
  - {name: LunarLander-v2-jax, n_seeds: 30, chunk_size: 30}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000

interventions:
  - name: "g099_{from_env: name}"
    base: {gamma: 0.99}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: "g0999_{from_env: name}"
    base: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
