name: asterix_si_canonical_verify_resume
out_dir: experiments/data/asterix_si_canonical_verify_resume
env_binding: per_env
archive_remote: s3://corroborate-archive/asterix_si_canonical_verify_resume

# Resume of asterix_si_canonical_verify after the parent sweep
# crashed mid-flight (CUDA/ptxas issue + uv venv corruption).
#
# Parent state:
#   - Asterix-MinAtar: 40 seeds (0..39) × 2 arms = 80 cells in
#     `verify_Asterix-MinAtar/runs.parquet` + `traces.parquet`,
#     cleanly merged. Need seeds 40..59 to fill out 60-seed budget.
#   - SpaceInvaders-MinAtar: 0 cells (never ran — sweep died at
#     the post-Asterix transition).
#
# This resume covers:
#   - Asterix seeds 40..59 (seed_offset=40, n_seeds=20)
#   - SpaceInvaders 0..59 (full)
# Post-run, a one-off concat merges Asterix-resume into the parent.

envs:
  - {name: Asterix-MinAtar, n_seeds: 20, chunk_size: 10, seed_offset: 40}
  - {name: SpaceInvaders-MinAtar, n_seeds: 60, chunk_size: 10}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: "verify_{from_env: name}"
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
