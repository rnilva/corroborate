name: minatar_sync_intervention
out_dir: experiments/data/minatar_sync_intervention
arms_shape: paired
archive_remote: s3://corroborate-archive/minatar_sync_intervention

# GPU. Sync=10000 intervention on minatar 1M to corroborate the
# Q-explosion → β-collapse → link-attenuation hypothesis.
#
# Existing minatar_1M (sync=100) shows plc 0.05-0.25 (link dies after
# Phase 1) on Asterix/Breakout/Freeway. Predicts: with sync=10000 (Mnih
# default, slow target), Q stays bounded, β doesn't collapse, plc → 1.0.
#
# 4 envs × 2 arms × 30 seeds × 1M steps = 240 cells with CNN. Slow.

envs:
  - {name: Asterix-MinAtar,        n_seeds: 30, chunk_size: 15}
  - {name: Breakout-MinAtar,       n_seeds: 30, chunk_size: 15}
  - {name: Freeway-MinAtar,        n_seeds: 30, chunk_size: 15}
  - {name: SpaceInvaders-MinAtar,  n_seeds: 30, chunk_size: 15}

base_intervention:
  total_steps: 1000000
  eval_every:  50000
  n_episodes:  5
  gamma:       0.99
  sync_period: 10000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    class: WarmedUpdate
    inner: {class: Adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [128]

hypotheses:
  - name: vanilla_dqn
    predicted_direction: null
    intervention: {}

  - name: ddqn
    predicted_direction: a_gt_b
    intervention:
      bootstrap:
        fn: bootstrap
        greedification: {fn: double_greedify}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
