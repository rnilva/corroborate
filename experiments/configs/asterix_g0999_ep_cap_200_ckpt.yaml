name: asterix_g0999_ep_cap_200_ckpt
out_dir: experiments/data/asterix_g0999_ep_cap_200_ckpt
env_binding: shared
archive_remote: s3://corroborate-archive/asterix_g0999_ep_cap_200_ckpt

# Asterix γ=0.999 with EpisodeLengthCap(max_steps=200). At γ=0.999
# the effective horizon 1/(1−γ) = 1000; canonical Asterix has
# mean ep_len ≈ 750 (i.e. eff_H ≈ ep_len). The mechanism in
# `findings_bg_stabilization_mechanism.md` predicts that
# unanchored bootstrap chains (eff_H > ep_len) are the load-
# bearing condition for bg-divergence harm at this corpus.
#
# Test: capping ep_len at 200 (5× below eff_H) should restore
# terminal-anchoring of the Q-recursion and flip bg-trajectory
# shape from monotone-growth to peak-then-decay.
#
# Predictions:
#   - bg per burst should PEAK EARLY (burst < 25) and DECAY by end,
#     matching the Asterix γ=0.99 shape (peak burst 4 → final/peak
#     ≈ 0.59) and unlike canonical γ=0.999 (peak burst 49,
#     final/peak = 1.00).
#   - Cohen's d_raw should shift from canonical −0.68 toward zero
#     or positive (Hasselt-canonical regime restored).
#
# Caveat: eval episodes are ALSO capped at 200 steps by this
# wrapper. Eval score becomes "best burst's mean return in
# 200-step Asterix" — comparable across arms but NOT directly
# comparable to canonical-1000 eval magnitudes.
#
# Same canonical HPs otherwise: 1M training steps, n_episodes=20,
# sync=1000, lr=1e-4 + warmup, ε anneal 100k, γ=0.999. Q
# checkpoints kept for downstream per-burst bg-trajectory analysis
# (the diagnostic primitive for the mechanism finding).
#
# Cells: 1 intervention × 2 arms × 15 seeds = 30 cells.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true

envs:
  - {name: Asterix-MinAtar, n_seeds: 15, chunk_size: 15,
     wrappers: [{type: episode_length_cap, max_steps: 200}]}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  20
  gamma:       0.999
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 4]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: ep_cap_200
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
