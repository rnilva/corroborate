name: k_sweep_minatar
out_dir: experiments/data/k_sweep_minatar
arms_shape: chunked

# action-duplicate (k) sweep on Freeway (bias-channel TARGET) +
# Breakout (policy-channel CONTROL).
#
# Pre-registered hypotheses:
#   - Freeway: d_jens AND d_out_raw scale with √(log K)
#     (bias-channel mediation, 95% jens absorption per memory
#     `findings_ddqn_mediator_heterogeneity`)
#   - Breakout: d_out_raw is k-INVARIANT despite d_jens scaling
#     (policy-structure-channel mediation; d_out flows through
#     entropy, not jens)
#
# If both hold: bias-vs-policy-structure channels are causally
# distinguished by active manipulation of the Hasselt-floor
# variable. If Breakout's d_out scales with k, the entropy-
# mediation Finding is refuted (jens IS the load-bearing
# mediator after all).
#
# k ∈ {1, 4, 16} × 2 envs × 2 arms × 30 seeds × 1M = 360 cells.
envs:
  - {name: Breakout-MinAtar, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 1}]}
  - {name: Breakout-MinAtar, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 4}]}
  - {name: Breakout-MinAtar, n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 16}]}
  - {name: Freeway-MinAtar,  n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 1}]}
  - {name: Freeway-MinAtar,  n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 4}]}
  - {name: Freeway-MinAtar,  n_seeds: 30, chunk_size: 10, wrappers: [{type: action_duplicate, k: 16}]}

base_intervention:
  total_steps: 1000000
  eval_every:  100000
  n_episodes:  5
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16]
    kernel_size: 3
    hidden: [128]

hypotheses:
  - name: ddqn_vs_vanilla
    predicted_direction: a_gt_b
    intervention: {}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
