name: acrobot_gamma_50k_30seeds
out_dir: experiments/data/acrobot_gamma_50k_30seeds
env_binding: per_env
archive_remote: s3://corroborate-archive/acrobot_gamma_50k_30seeds

# Acrobot γ ∈ {0.99, 0.999} 50k-budget sweep on CPU.
#
# 50k training steps, 20 eval bursts (eval_every=2500). 100k showed
# one vanilla seed catastrophically failed (MC=-452 vs rest at ~-77)
# dominating the mean while DDQN was tight at -75. The trimmed
# Cohen-d ≈ +0.93 (genuine large effect) suggests cleaner separation
# is achievable; 50k targets the regime before that catastrophic
# regime emerges so the population evidence shows up unaliased.
#
# 30 seeds per (γ, arm) × 2 γ × 2 arms = 120 cells total.

envs:
  - {name: Acrobot-v1, n_seeds: 30, chunk_size: 10}

defaults:
  total_steps: 50000
  eval_every:  2500
  n_episodes:  5
  gamma:       0.99
  sync_period: 100
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  q_network:
    class: MLP
    hidden: [64, 64]
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 5000

interventions:
  - name: g099
    base: {gamma: 0.99}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}

  - name: g0999
    base: {gamma: 0.999}
    arms:
      - []
      - - slot_path: bootstrap
          replacement:
            fn: bootstrap
            greedification: {fn: double_greedify}
