name: snake_jumanji_smoke
out_dir: experiments/data/snake_jumanji_smoke
arms_shape: paired

# Smoke test for jumanji backend integration. Snake-jumanji is a
# 12×12×5 grid, 4-action, SURVIVE-class env (per-step +1 reward
# per fruit, episode terminates on collision). Targets the
# argmax_entropy_van moderation hypothesis (CLAIM 20) which
# predicts SURVIVE envs with action-redundancy show stronger DDQN
# benefit. 1 env × 2 arms × 3 seeds × 20k steps; CNN q_network.
envs:
  - {name: Snake-jumanji, n_seeds: 1, chunk_size: 1}

base_intervention:
  total_steps: 2000
  eval_every:  1000
  n_episodes:  1
  gamma:       0.99
  sync_period: 1000
  replay:
    class: Replay
    capacity: 50000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  q_network:
    class: CNN
    obs_shape: {from_env: observation_shape}
    channels: [16, 32]
    kernel_size: 3
    hidden: [64]

hypotheses:
  - name: ddqn_vs_vanilla_smoke
    predicted_direction: a_gt_b
    intervention: {}
    intervention_arms:
      - slot_path: bootstrap
        replacement:
          fn: bootstrap
          greedification: {fn: double_greedify}
