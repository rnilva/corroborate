name: si_g099_canonical_n_eps1_ckpt
out_dir: experiments/data/si_g099_canonical_n_eps1_ckpt
env_binding: shared
archive_remote: s3://corroborate-archive/si_g099_canonical_n_eps1_ckpt

# SpaceInvaders-MinAtar γ=0.99 canonical with full Q traces +
# per-burst Q checkpoints, mirroring asterix_g099_canonical_n_eps20_ckpt
# but with n_episodes=1 (SI has 0 RNG calls in MinAtar transition —
# fully deterministic under greedy policy per the asterix_si_canonical_verify
# notes — bumping n_episodes doesn't reduce eval variance for SI).
#
# chunk_size=15 (matches asterix γ=0.99 canonical_n_eps20_ckpt's
# known-good footprint). Tried chunk=30 first per the request — HLO
# scheduler reported 34.8 GiB input/output args vs 30.3 GiB base
# limit; jit_squeeze OOM at 6.71 GiB on the RTX 5090's 32 GiB.
#
# Cells: 2 arms × 2 chunks of 15 seeds = 4 batched cells.

keep_q_checkpoint_per_burst: true
keep_q_checkpoint_final: true
keep_q_per_action: true

envs:
  - {name: SpaceInvaders-MinAtar, n_seeds: 30, chunk_size: 15}

defaults:
  total_steps: 1000000
  eval_every:  20000
  n_episodes:  1
  gamma:       0.99
  sync_period: 1000
  n_step:      1
  replay:
    class: Replay
    capacity: 100000
    batch_size: 32
  optimizer:
    fn: warmed_update
    inner: {fn: adam, lr: 0.0001}
    warmup_steps: 100
  action_select:
    fn: epsilon_greedy
    schedule:
      fn: linear_epsilon
      eps_init: 1.0
      eps_final: 0.05
      anneal_steps: 100000
  q_network:
    class: CNN
    obs_shape: [10, 10, 6]
    channels: [16]
    kernel_size: 3
    hidden: [128]

interventions:
  - name: canonical_g099_n_eps1
    base: {}
    arms:
      - []
      - - slot_path: bootstrap
          replacement: {fn: bootstrap, greedification: {fn: double_greedify}}
