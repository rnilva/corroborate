[project]
name = "corroborate-rl"
version = "0.0.1"
description = "RL substrate for corroborate — DQN, env catalogue, sweep dispatcher"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "corroborate>=0.0.1",
    # The `cuda12` extra pulls `jax-cuda12-plugin`, which publishes
    # manylinux wheels ONLY. Requesting it unconditionally makes the
    # whole workspace unresolvable off Linux — `uv run` fails before
    # it can even create the venv, so a reader on macOS cannot run
    # the hypothesis, the tests, or the paper figures at all. Sweeps
    # need the GPU plugin; re-running the shipped analyses does not.
    "jax[cuda12]>=0.4.30; sys_platform == 'linux'",
    "jax>=0.4.30; sys_platform != 'linux'",
    "jaxlib>=0.4.30",
    "optax>=0.2.0",
    "gymnax>=0.0.8",
    "pgx>=2.0.0",           # MinAtar Seaquest backend (Seaquest absent from gymnax MinAtar)
    "pyyaml>=6.0",          # `dqn.yaml_sweep` + framework `load_hypothesis`
]

[project.scripts]
# Re-eval a `*_ckpt` corpus at a chosen n_episodes from saved
# per-burst Q-checkpoints (no retraining). Substrate-specific
# corpus transform — NOT a sweep, so it gets its own console entry
# rather than a `corroborate sweep run` hook.
corroborate-rl-reeval = "corroborate_rl.reeval_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corroborate_rl"]

[tool.uv.sources]
# Pull `corroborate` from the workspace (sibling package at the
# repo root) rather than PyPI during local development.
corroborate = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not slow'"
markers = [
    "slow: end-to-end DQN/JAX workloads (jit compile + scan loops). Skipped by default for fast iteration. Run via `uv run pytest -m slow tests/` to run only slow tests, or `uv run pytest -m '' tests/` (empty marker) to run the full suite.",
]

[tool.basedpyright]
include = ["corroborate_rl", "tests"]
extraPaths = ["../.."]
# Stubs live at the workspace root (`<repo>/stubs/`); pyright
# resolves stubPath relative to this pyproject's location, so go
# up two levels.
stubPath = "../../stubs"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportImplicitOverride = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "none"
# JAX leaks Any through jnp.* return types under stubs; the RL
# subtree is the boundary where stub looseness is unavoidable.
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

# Tests carry the same stub-looseness budget plus the
# unused-function relaxation for `@measurable` / `@claim` fixtures
# whose only purpose is registry-side-effect.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnusedFunction = "none"
